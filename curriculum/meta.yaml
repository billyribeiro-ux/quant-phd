# Program-level metadata. Single source of truth for tiers, milestones,
# career tracks and the Atlas build. Rendered by tools/render_curriculum.py.

program:
  name: "Doctoral-Track Major in Finance, Economics & Quantitative Markets"
  version: "2.0"
  date: "2026-10-10"

tiers:
  - code: F
    rank: 1
    name: Foundations
    standard: "Rigorous first-two-years university mathematics, computing, statistics and economics."
  - code: U
    rank: 2
    name: Major
    standard: "Complete undergraduate finance major at a top program, plus the quantitative depth most majors skip."
  - code: M
    rank: 3
    name: "Master's"
    standard: "MFE / MSF / MSc Economics level: continuous-time finance, econometrics, and production research."
  - code: D
    rank: 4
    name: Doctoral
    standard: "First-year PhD coursework in asset pricing, econometrics and macro, then original research."

milestones:
  - id: MAJOR
    name: "Major Complete"
    tiers: [F, U]
    exclude: []
    rule: "Every F and U module project passed, plus every studio of tier F or U."
  - id: MASTERS
    name: "Master's-Equivalent"
    tiers: [F, U, M]
    exclude: []
    rule: "MAJOR, plus every M module project and every M studio."
  - id: CANDIDATE
    name: "Doctoral Candidate"
    tiers: [F, U, M, D]
    exclude: [CAP4]
    rule: "MASTERS, plus every D module and studio, including the CAP3 qualifying exam."
  - id: DOCTORAL
    name: "Doctoral"
    tiers: [F, U, M, D]
    exclude: []
    rule: "CANDIDATE, plus the CAP4 thesis defended against the rubric."

# Credentials are named, content-equivalent degrees: explicit views over the
# DAG. The validator checks each one:
#   - every listed module and studio exists
#   - every module in the prerequisite closure sits at or below max_tier
#   - every studio's required modules are inside the closure
#   - every course-map entry points at modules inside the closure
# Hours are computed, never typed. These are not accredited degrees: only an
# accredited, state-authorized institution can award a degree.
credentials:
  - id: BS-FIN
    name: "Finance Degree — Bachelor's Level"
    level: bachelor
    max_tier: U
    requires: [CAP0, FC1, FC2, FC3, FC4, AC1, AC2, AC4, CF1, CF2, CF3, CF4, CF7, CF8, CF9,
               BK1, BK2, BK4, BK5, FI1, FI4, AP2, E1, E2, E5, S2, LX1, LX2, PC1, PC2, PC3]
    studios: [STUDIO-FC, STUDIO-AC, STUDIO-BK, STUDIO-LX, STUDIO-PC]
    course_map:
      - {group: "Quantitative & business core", course: "Calculus", modules: [M1, M2]}
      - {group: "Quantitative & business core", course: "Statistics for Finance", modules: [S0, S1]}
      - {group: "Quantitative & business core", course: "Regression & Econometrics", modules: [S2]}
      - {group: "Quantitative & business core", course: "Programming for Finance", modules: [CS1]}
      - {group: "Quantitative & business core", course: "Microeconomics", modules: [E1]}
      - {group: "Quantitative & business core", course: "Macroeconomics", modules: [E5]}
      - {group: "Quantitative & business core", course: "Financial Accounting", modules: [AC1]}
      - {group: "Quantitative & business core", course: "Managerial Accounting", modules: [AC4]}
      - {group: "Quantitative & business core", course: "Business Law & Professional Ethics", modules: [LX2]}
      - {group: "Quantitative & business core", course: "Business Communication", modules: [PC1]}
      - {group: "Finance major", course: "Principles of Finance / Corporate Finance I", modules: [CF1, CF2]}
      - {group: "Finance major", course: "Corporate Finance II: Payout & Governance", modules: [CF3, E2]}
