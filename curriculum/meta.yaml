# Program-level metadata. Single source of truth for tiers, milestones,
# career tracks and the Atlas build. Rendered by tools/render_curriculum.py.

program:
  name: "Doctoral-Track Major in Finance, Economics & Quantitative Markets"
  version: "2.0"
  date: "2026-10-10"

tiers:
  - code: F
    rank: 1
    name: Foundations
    standard: "Rigorous first-two-years university mathematics, computing, statistics and economics."
  - code: U
    rank: 2
    name: Major
    standard: "Complete undergraduate finance major at a top program, plus the quantitative depth most majors skip."
  - code: M
    rank: 3
    name: "Master's"
    standard: "MFE / MSF / MSc Economics level: continuous-time finance, econometrics, and production research."
  - code: D
    rank: 4
    name: Doctoral
    standard: "First-year PhD coursework in asset pricing, econometrics and macro, then original research."

milestones:
  - id: MAJOR
    name: "Major Complete"
    tiers: [F, U]
    exclude: []
    rule: "Every F and U module project passed, plus every studio of tier F or U."
  - id: MASTERS
    name: "Master's-Equivalent"
    tiers: [F, U, M]
    exclude: []
    rule: "MAJOR, plus every M module project and every M studio."
  - id: CANDIDATE
    name: "Doctoral Candidate"
    tiers: [F, U, M, D]
    exclude: [CAP4]
    rule: "MASTERS, plus every D module and studio, including the CAP3 qualifying exam."
  - id: DOCTORAL
    name: "Doctoral"
    tiers: [F, U, M, D]
    exclude: []
    rule: "CANDIDATE, plus the CAP4 thesis defended against the rubric."

# Career tracks are views over the DAG, not separate content. The required set
# for a track is the transitive prerequisite closure of its targets. The render
# script computes each track's hours, so the job-ready path is a measured
# number, not a promise.
tracks:
  - id: QR
    name: "Quantitative Researcher"
    targets: [F6, QR2, PR4, MS4, S7, CAP1]
  - id: GMPM
    name: "Global Macro Portfolio Manager"
    targets: [GM5, FI3, X2, DV5, PR3, PC2]
  - id: VOL
    name: "Derivatives & Volatility"
    targets: [DV3, DV4, DV5, DV6, FI6]
  - id: CORP
    name: "Corporate Finance / Investment Banking / Private Equity"
    targets: [CF5, CF6, PM1, PM2, AC3, PC2]
  - id: QDEV
    name: "Quant Developer"
    targets: [CS6, QR2, MS2, DV4]
  - id: RISK
    name: "Risk & Financial Stability"
    targets: [PR4, SR3, SR4, BK3]
  - id: PHD
    name: "Research doctorate (minimum prerequisite path to thesis)"
    targets: [CAP4]

# Atlas: one production-grade research and trading platform that the student
# builds across the whole program. Each milestone is the project of the named
# module. Later milestones import earlier ones, so earlier work compounds
# rather than being thrown away.
atlas:
  - id: A1
    module: CS1
    title: "Repository skeleton"
    delivers: "Typed Python package, CLI entry point, test harness, pre-commit, CI config."
  - id: A2
    module: CS3
    title: "Data layer"
    delivers: "DuckDB store, point-in-time schema, ingestion for FRED / French / Shiller / Treasury / EDGAR, data manifest with hashes."
  - id: A3
    module: S0
    title: "Data-quality and EDA reports"
    delivers: "Automated profiling (gaps, outliers, stale prints, splits) on any Atlas dataset."
  - id: A4
    module: S4
    title: "Time-series toolkit"
    delivers: "ARMA, GARCH, HAR and Kalman estimators with forecast-evaluation tests."
  - id: A5
    module: FI1
    title: "Curve engine"
    delivers: "Bootstrapping plus Nelson–Siegel and Svensson fitting, with day-count conventions."
  - id: A6
    module: DV4
    title: "Pricing library"
    delivers: "BSM, binomial, finite differences, Monte Carlo and LSMC with Greeks; C++ kernel behind a Python API."
  - id: A7
    module: F1
    title: "Cross-sectional engine"
    delivers: "Portfolio sorts, Fama–MacBeth with Shanken correction, GRS test."
  - id: A8
    module: S7
    title: "Research-integrity module"
    delivers: "Deflated Sharpe, PBO, Romano–Wolf and BH adjustments, applied automatically to every backtest."
  - id: A9
    module: QR2
    title: "Backtester"
    delivers: "Event-driven engine with signal/execution lags, cost hooks, walk-forward and purged CV."
  - id: A10
    module: MS3
    title: "Execution and cost models"
    delivers: "Square-root impact, Almgren–Chriss scheduler, implementation-shortfall accounting."
  - id: A11
    module: PR2
    title: "Portfolio construction"
    delivers: "Shrinkage covariance, MV / risk-parity / vol-target allocators with constraint handling."
  - id: A12
    module: PR4
    title: "Risk engine"
    delivers: "VaR / ES (historical, parametric, EVT), VaR backtests, scenario and stress engine."
  - id: A13
    module: FI3
    title: "Term-premium and rates-RV module"
    delivers: "Affine-model term premium, carry and roll-down, curve-trade P&L attribution."
  - id: A14
    module: CR1
    title: "Credit module"
    delivers: "Merton / Black–Cox / reduced-form pricers, distance to default, spread decomposition."
  - id: A15
    module: AC2
    title: "Fundamentals engine"
    delivers: "EDGAR XBRL ingestion, standardized statements, ratio and accrual-quality library."
  - id: A16
    module: CF4
    title: "Valuation engine"
    delivers: "DCF, residual income and multiples, with scenario and sensitivity grids driven by A15."
  - id: A17
    module: QR3
    title: "ML pipeline"
    delivers: "Feature store, purged/embargoed CV, model registry, SHAP reports, plugged into A8 and A9."
  - id: A18
    module: GM1
    title: "Nowcasting and regime dashboard"
    delivers: "Real-time-vintage dynamic factor nowcast, regime classifier, cross-asset monitor."
  - id: A19
    module: SR3
    title: "Systemic-risk monitor"
    delivers: "CoVaR, SRISK and MES on open data, with alert thresholds."
  - id: A20
    module: GM4
    title: "Macro trade-construction engine"
    delivers: "View → expression → sizing → scenario P&L, reusing A5, A6, A11, A12."
