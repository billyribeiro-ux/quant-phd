      - {group: "Finance major", course: "Financial Markets & Institutions", modules: [FC1, BK1, FI4, BK4]}
      - {group: "Finance major", course: "Financial Statement Analysis", modules: [AC2]}
      - {group: "Finance major", course: "Valuation", modules: [CF4]}
      - {group: "Finance major", course: "Financial Modeling", modules: [CF7]}
      - {group: "Finance major", course: "Short-Term Financial Management", modules: [CF8]}
      - {group: "Finance major", course: "Fixed Income", modules: [FI1]}
      - {group: "Finance major", course: "Derivatives", modules: [FC2]}
      - {group: "Finance major", course: "Risk Management & International Finance", modules: [CF9]}
      - {group: "Finance major", course: "Asset Management", modules: [BK2]}
