parts:
  - order: 22
    code: LX
    title: "History, Law & Professional Conduct"
    studio:
      id: STUDIO-LX
      tier: U
      requires: [LX1, LX2]
      title: "Case File from Primary Documents"
      hours: 40
      grading: rubric
      brief: >-
        Reconstruct one historical crisis or one enforcement case (e.g., a manipulation
        or insider-trading prosecution) entirely from primary documents (statutes,
        court opinions, official reports, contemporaneous data), with a timeline,
        mechanism and lessons, every assertion cited.
      deliverables: ["Case file"]
    modules:
      - id: LX1
        title: "Financial History"
        tier: U
        hours: 50
        prereqs: [FC1, E5]
        core: >-
          Bubbles and panics from the Dutch Republic to 2008, the gold standard and the
          Great Depression, Bretton Woods and its end, the history of central banking.
        sources:
          - "Kindleberger & Aliber, Manias, Panics, and Crashes, 7th ed. (2015)"
          - "Friedman & Schwartz, A Monetary History of the United States, 1867–1960 (1963)"
          - "Bernanke (1983), AER 73(3)"
          - "Eichengreen, Golden Fetters (1992)"
          - "Garber, Famous First Bubbles (2000)"
        lab: "Gold-standard adherence vs. depression depth on embedded data."
        project:
          title: "Then vs. now"
          brief: >-
            Pick one historical episode and one current market condition, and write a
            mechanism-level comparison that says where the analogy holds and where it
            breaks.
          deliverable: "Two-page essay, every claim cited."
          grading: rubric
      - id: LX2
        title: "Securities Law, Regulation & Professional Conduct"
        tier: U
        hours: 50
        prereqs: [FC1]
        core: >-
          The 1933 and 1934 Acts, insider-trading doctrine, manipulation, disclosure,
          Dodd-Frank, MiFID II, fiduciary duty, conflicts of interest, model-risk
          governance.
        sources:
          - "Securities Act of 1933; Securities Exchange Act of 1934 (primary)"
          - "SEC v. Texas Gulf Sulphur Co., 401 F.2d 833 (2d Cir. 1968)"
          - "Dirks v. SEC, 463 U.S. 646 (1983)"
          - "United States v. O'Hagan, 521 U.S. 642 (1997)"
          - "Federal Reserve SR 11-7, Guidance on Model Risk Management (2011) (primary)"
          - "CFA Institute Code of Ethics and Standards of Professional Conduct (practitioner)"
        lab: "Insider-trading fact-pattern classifier (rule-based, with doctrine citations)."
        project:
          title: "Model-risk validation report"
          brief: >-
            Write an SR 11-7-style validation report on one of your own Atlas models:
            conceptual soundness, outcomes analysis, limitations, ongoing monitoring.
          deliverable: "Validation report."
          grading: rubric

  - order: 23
    code: PC
    title: "Professional Craft"
    studio:
      id: STUDIO-PC
      tier: U
      requires: [PC2]
      title: "Investment Committee Defense"
      hours: 40
      grading: rubric
      brief: >-
        Present one finished research result or trade idea to a hostile investment
        committee. Questions are drawn from a bank of attack angles (data, inference,
        costs, regime, capacity, crowding). Graded on the rubric, with recorded
        self-review against exemplars.
      deliverables: ["Deck", "Written Q&A defense", "Self-review"]
    modules:
      - id: PC1
        title: "Research Writing & Presentation"
        tier: U
        hours: 30
        prereqs: [P0.1, S0]
        core: >-
          Writing a finance paper (structure, introductions that state the result,
          tables that stand alone), slides, presenting to an expert audience.
        sources:
          - "Cochrane (2005), 'Writing Tips for Ph.D. Students' (note)"
          - "McCloskey, Economical Writing, 3rd ed. (2019)"
        lab: "Table and figure redesign drill."
        project:
          title: "Rewrite a weak paper introduction"
          brief: >-
            Rewrite three supplied weak introductions to the Cochrane standard, and
            annotate every change.
          deliverable: "Rewrites plus annotations."
          grading: rubric
      - id: PC2
        title: "Investment Memos & Trade Pitches"
        tier: U
        hours: 40
        prereqs: [CF4, PC1]
        core: >-
          The investment memo, the one-page trade pitch, base/bull/bear cases,
          catalysts, pre-mortems, risk and sizing sections, and how ICs actually
          attack.
        sources:
          - "Klein (2007), 'Performing a Project Premortem', Harvard Business Review 85(9)"
        lab: "Pre-mortem generator."
        project:
          title: "Two pitches"
          brief: >-
            Write one long equity pitch (from your A16 valuation) and one macro trade
            pitch (from your A20 engine), each surviving a scripted adversarial
            Q&A.
          deliverable: "Two memos plus Q&A responses."
          grading: rubric
      - id: PC3
        title: "Quant & Finance Interviews"
        tier: U
        hours: 50
        prereqs: [M4, CS2, FC2]
        core: >-
          Probability puzzles, expected-value and market-making games, mental math,
          coding under time pressure, technical finance questions, case interviews.
        sources:
          - "Zhou, A Practical Guide to Quantitative Finance Interviews (2008)"
          - "Crack, Heard on the Street (practitioner)"
        lab: "Timed probability drill set with spaced repetition."
        project:
          title: "Market-making game"
          brief: >-
            Play the in-page market-making game against scripted counterparties with
            hidden information, and write a post-game analysis of your edge and
            inventory risk.
          deliverable: "Game log plus analysis."
          grading: both

  - order: 24
    code: CAP
    title: "Capstone"
    modules:
      - id: CAP1
        title: "Reading, Refereeing & Replicating"
        tier: D
        hours: 120
        prereqs: [F5, S7, QR2]
        core: >-
          The referee report as a genre, full replication of a published result from
          open data, and diagnosing why replications diverge.
        sources:
          - "Berk, Harvey & Hirshleifer (2017), 'How to Write an Effective Referee Report and Improve the Scientific Review Process', Journal of Economic Perspectives 31(1)"
        lab: "Replication-diff tool: where does my number diverge from the paper?"
        project:
          title: "Replication package"
          brief: >-
            Fully replicate one assigned paper's main table from open data, document
            every divergence, and write a referee report on the original.
          deliverable: "Replication package plus referee report."
          grading: both
      - id: CAP2
        title: "The Great Debates"
        tier: D
        hours: 120
        prereqs: [AP4, AP8, F5, F6, E7, GM4, PR2, MS2, DV5]
        core: >-
          Twelve resolutions, each with a steelman for both sides, graded evidence and
          a 'what would settle it' section: markets are efficient; the equity premium
          is a risk premium; value is dead; most factors are false discoveries; QE works
          via portfolio balance; UIP failure is a risk premium; complexity helps
          prediction; trend survived 2009; vol-managed portfolios win after costs; r*
          has fallen permanently; FTPL explains 2021–23; HFT improves market quality.
        sources:
          - "All debate-tagged module sources; freshness pass for 2025–2026 work"
        lab: "Evidence-map builder per resolution."
        project:
          title: "Debate tournament"
          brief: >-
            For four drawn resolutions, write both sides blind, then argue the side
            assigned at random against the program's model brief, scored on the rubric.
          deliverable: "Eight briefs plus rebuttals."
          grading: rubric
      - id: CAP3
        title: "Qualifying Examination"
        tier: D
        hours: 200
        prereqs: [AP4, AP6, S5, E7, SC6]
        core: >-
          Timed written exams in asset pricing, econometrics and macro/monetary,
          modeled on PhD prelims, with full solutions released after submission.
        sources:
          - "Program question bank (verified against module sources)"
        lab: "Two timed mock exams per field."
        project:
          title: "Qualifying exam"
          brief: >-
            Sit three timed exams. Pass mark per field is set by the rubric; one retake
            per field after a mandatory review cycle.
          deliverable: "Three exam scripts."
          grading: both
      - id: CAP4
        title: "Research Thesis & Defense"
        tier: D
        hours: 1200
        prereqs: [CAP1, CAP3]
        core: >-
          Original research: question selection, pre-registration, the full Atlas
          pipeline, writing, presenting, defending.
        sources:
          - "Discipline-specific, selected by the student and verified through the registry"
        lab: "Thesis pipeline template on Atlas."
        project:
          title: "Thesis"
          brief: >-
            An original, pre-registered contribution extending a replicated result,
            delivered as a journal-format paper with a full replication package and
            defended orally against the rubric.
          deliverable: "Paper, replication package, defense."
          grading: rubric
