parts:
  - order: 9
    code: FI
    title: "Fixed Income & Rates"
    studio:
      id: STUDIO-FI
      tier: M
      requires: [FI1, FI3]
      title: "Rates Desk"
      hours: 60
      grading: both
      brief: >-
        Fit the Treasury curve daily over a historical window, decompose yields into
        expectations and term premium, construct two relative-value trades (a curve
        trade and a butterfly) with carry, roll-down and DV01-neutral sizing, and
        attribute their historical P&L.
      deliverables: ["Curve and term-premium code", "Trade book", "P&L attribution report"]
    modules:
      - id: FI1
        title: "Bond Math & Curve Construction"
        tier: U
        hours: 90
        prereqs: [M2, CF1]
        core: >-
          Pricing, yield conventions, day counts, duration, convexity, DV01,
          bootstrapping, Nelson–Siegel and Svensson, the GSW curve.
        sources:
          - "Nelson & Siegel (1987), Journal of Business 60(4)"
          - "Svensson (1994), NBER Working Paper 4871"
          - "Gürkaynak, Sack & Wright (2007), JME 54(8)"
        lab: "Fit Nelson–Siegel to an embedded curve."
        project:
          title: "Atlas A5: curve engine"
          brief: >-
            Add bootstrapping, NS / Svensson fitting and full day-count support to
            Atlas, tested against published GSW parameters.
          deliverable: "Atlas at milestone A5."
          grading: autograder
          atlas: A5
      - id: FI2
        title: "Term-Structure Models"
        tier: M
        hours: 120
        prereqs: [FI1, SC3]
        core: >-
          Short-rate models (Vasicek, CIR), the affine class, HJM, the LIBOR market
          model, calibration.
        sources:
          - "Vasicek (1977), JFE 5(2)"
          - "Cox, Ingersoll & Ross (1985), Econometrica 53(2)"
          - "Duffie & Kan (1996), Mathematical Finance 6(4)"
          - "Dai & Singleton (2000), JF 55(5)"
          - "Heath, Jarrow & Morton (1992), Econometrica 60(1)"
          - "Brace, Gatarek & Musiela (1997), Mathematical Finance 7(2)"
        lab: "Vasicek closed form vs. Monte Carlo."
        project:
          title: "Affine model calibration"
          brief: >-
            Calibrate a three-factor Gaussian affine model to the historical curve by
            Kalman-filter MLE, and validate its pricing errors and factor dynamics.
          deliverable: "Calibration code plus diagnostics."
          grading: both
      - id: FI3
        title: "Bond Risk Premia & the Expectations Hypothesis"
        tier: M
        hours: 80
        prereqs: [FI1, S3]
        core: >-
          Failure of the expectations hypothesis, forward-rate regressions, the
          Cochrane–Piazzesi factor, model-based term premia, robustness debates.
        sources:
          - "Fama & Bliss (1987), AER 77(4)"
          - "Campbell & Shiller (1991), REStud 58(3)"
          - "Cochrane & Piazzesi (2005), AER 95(1)"
          - "Adrian, Crump & Moench (2013), JFE 110(1)"
          - "Bauer & Hamilton (2018), RFS 31(2)"
        lab: "Cochrane–Piazzesi factor on GSW data."
        project:
          title: "Atlas A13: term-premium and rates-RV module"
          brief: >-
            Add ACM-style term premium, carry and roll-down analytics, and curve-trade
            P&L attribution to Atlas.
          deliverable: "Atlas at milestone A13."
          grading: autograder
          atlas: A13
        debate: "Are excess bond returns predictable out of sample?"
      - id: FI4
        title: "Money Markets & Plumbing"
        tier: U
        hours: 60
        prereqs: [FI1, E5]
        core: >-
          Repo, SOFR, reserves and the Fed balance sheet, the Treasury basis trade,
          dealer balance-sheet constraints, the SLR, the March 2020 dash for cash.
        sources:
          - "He, Nagel & Song (2022), JFE 143(1)"
          - "Federal Reserve H.4.1 release (primary)"
          - "Federal Reserve Bank of New York SOFR methodology (primary)"
        lab: "Basis-trade P&L with haircut and margin."
        project:
          title: "Plumbing monitor"
          brief: >-
            Track reserves, the reverse-repo facility, TGA, repo spreads and
            swap spreads from public data, and write a mechanism-level explanation of
            one stress episode.
          deliverable: "Monitor plus memo."
          grading: both
      - id: FI5
        title: "Inflation-Linked Markets"
        tier: M
        hours: 40
        prereqs: [FI3]
        core: "TIPS mechanics, breakevens, inflation and liquidity premia, the TIPS–Treasury puzzle."
        sources:
          - "D'Amico, Kim & Wei (2018), JFQA 53(1)"
          - "Fleckenstein, Longstaff & Lustig (2014), JF 69(5)"
        lab: "Breakeven decomposition."
        project:
          title: "Inflation-expectations decomposition"
          brief: >-
            Decompose breakevens into expected inflation, inflation risk premium and
            liquidity premium using a published-model approach on public data.
          deliverable: "Code plus memo."
          grading: both
      - id: FI6
        title: "Interest-Rate Derivatives"
        tier: M
        hours: 100
        prereqs: [FI2, DV1]
        core: >-
          Swaps, caps and floors, swaptions, Black-76, the Bachelier model, SABR,
          multi-curve discounting, the LIBOR-to-SOFR transition.
        sources:
          - "Black (1976), JFE 3(1-2)"
          - "Hagan, Kumar, Lesniewski & Woodward (2002), Wilmott Magazine"
          - "Brigo & Mercurio, Interest Rate Models: Theory and Practice, 2nd ed. (2006)"
        lab: "Swaption under normal vs. lognormal models."
        project:
          title: "Swaption-cube engine"
          brief: >-
            Calibrate SABR per expiry and tenor to an embedded vol snapshot, enforce
            arbitrage checks, and price off-grid swaptions.
          deliverable: "Tested engine."
          grading: autograder

  - order: 10
    code: AP
    title: "Asset Pricing Theory"
    studio:
      id: STUDIO-AP
      tier: D
      requires: [AP3, AP4]
      title: "Pricing-Kernel Laboratory"
      hours: 70
      grading: both
      brief: >-
        Compute Hansen–Jagannathan bounds from embedded consumption and return data.
        Simulate habit, long-run-risk and rare-disaster economies, and score each
        against the same data moments. Write a referee-grade assessment of which model
        survives, and where.
      deliverables: ["Model simulations", "Moment-matching table", "Assessment report"]
    modules:
      - id: AP2
        title: "Mean-Variance, CAPM, ICAPM & APT"
        tier: U
        hours: 90
        prereqs: [M7, S1, E3]
        core: >-
          Portfolio choice, two-fund separation, CAPM derivation, the Roll critique,
          ICAPM, APT, the empirical failure of the CAPM.
        sources:
          - "Markowitz (1952), JF 7(1)"
          - "Tobin (1958), REStud 25(2)"
          - "Sharpe (1964), JF 19(3)"
          - "Lintner (1965), REStat 47(1)"
          - "Roll (1977), JFE 4(2)"
          - "Merton (1973), Econometrica 41(5)"
          - "Ross (1976), JET 13(3)"
          - "Fama & French (1992), JF 47(2)"
        lab: "Security market line on French portfolios."
        project:
          title: "CAPM on trial"
          brief: >-
            Test the CAPM with time-series and cross-sectional methods on open data, and
            write the verdict with the Roll critique addressed.
          deliverable: "Code plus verdict."
          grading: both
      - id: AP1
        title: "No-Arbitrage & the Stochastic Discount Factor"
        tier: M
        hours: 120
        prereqs: [M6, AP2]
        core: >-
          Law of one price, the fundamental theorem of asset pricing, state prices,
          p = E[mx], existence and uniqueness of the SDF, mean-variance frontier
          geometry in SDF terms.
        sources:
          - "Harrison & Kreps (1979), JET 20(3)"
          - "Harrison & Pliska (1981), Stochastic Processes and their Applications 11(3)"
          - "Delbaen & Schachermayer (1994), Mathematische Annalen 300"
          - "Cochrane, Asset Pricing, revised ed. (2005)"
          - "Duffie, Dynamic Asset Pricing Theory, 3rd ed. (2001)"
        lab: "Arbitrage detection via linear programming."
        project:
          title: "SDF recovery"
          brief: >-
            Recover the minimum-variance SDF from a set of test assets, verify that it
            prices them, and show its out-of-sample pricing errors.
          deliverable: "Code plus proof appendix."
          grading: both
      - id: AP3
        title: "Consumption-Based Pricing & Its Puzzles"
        tier: D
        hours: 100
        prereqs: [AP1, S5]
        core: >-
          The Lucas tree, the consumption CAPM, Hansen–Singleton GMM, the equity-premium
          and risk-free-rate puzzles, Hansen–Jagannathan bounds.
        sources:
          - "Lucas (1978), Econometrica 46(6)"
          - "Breeden (1979), JFE 7(3)"
          - "Hansen & Singleton (1982), Econometrica 50(5)"
          - "Mehra & Prescott (1985), JME 15(2)"
          - "Weil (1989), JME 24(3)"
          - "Hansen & Jagannathan (1991), JPE 99(2)"
        lab: "HJ bound vs. consumption-implied SDF volatility."
        project:
          title: "Euler-equation GMM"
          brief: >-
            Estimate the CCAPM Euler equations by GMM on embedded data, run the J-test,
            and interpret the rejection.
          deliverable: "Code plus note."
          grading: both
      - id: AP4
        title: "Resolving the Puzzles"
        tier: D
        hours: 100
        prereqs: [AP3]
        core: >-
          External habit, long-run risk, rare disasters, heterogeneous-agent models,
          and which survive the data.
        sources:
          - "Campbell & Cochrane (1999), JPE 107(2)"
          - "Bansal & Yaron (2004), JF 59(4)"
          - "Rietz (1988), JME 22(1)"
          - "Barro (2006), QJE 121(3)"
          - "Wachter (2013), JF 68(3)"
          - "Constantinides & Duffie (1996), JPE 104(2)"
          - "Beeler & Campbell (2012), Critical Finance Review 1(1)"
        lab: "Simulate each model's moments."
        project:
          title: "Model horse race"
          brief: >-
            Simulate the three canonical models under their published calibrations and
            score them on the same twelve data moments, out of sample where possible.
          deliverable: "Simulation code plus scorecard."
          grading: both
        debate: "Is the equity premium a risk premium?"
      - id: AP5
        title: "Present Value & Return Predictability"
        tier: M
        hours: 80
        prereqs: [AP1, S3]
        core: >-
          Excess volatility, the Campbell–Shiller decomposition, dividend-price
          regressions, the out-of-sample predictability debate, discount-rate
          variation.
        sources:
          - "Shiller (1981), AER 71(3)"
          - "Campbell & Shiller (1988), RFS 1(3)"
          - "Fama & French (1988), JFE 22(1)"
          - "Welch & Goyal (2008), RFS 21(4)"
          - "Campbell & Thompson (2008), RFS 21(4)"
          - "Cochrane (2008), RFS 21(4)"
          - "Cochrane (2011), JF 66(4)"
        lab: "CAPE regressions with Stambaugh-corrected inference."
        project:
          title: "Variance decomposition"
          brief: >-
            Decompose dividend-yield variance into cash-flow and discount-rate news with
            a VAR, and test sensitivity to sample and specification.
          deliverable: "Code plus note."
          grading: both
      - id: AP6
        title: "Intermediary & Institutional Asset Pricing"
        tier: D
        hours: 80
        prereqs: [AP5, E4]
        core: >-
          Limits to arbitrage, intermediary capital as the marginal investor,
          slow-moving capital, demand-system asset pricing, inelastic markets.
        sources:
          - "Shleifer & Vishny (1997), JF 52(1)"
          - "He & Krishnamurthy (2013), AER 103(2)"
          - "Adrian, Etula & Muir (2014), JF 69(6)"
          - "He, Kelly & Manela (2017), JFE 126(1)"
          - "Duffie (2010), JF 65(4)"
          - "Koijen & Yogo (2019), JPE 127(4)"
          - "Gabaix & Koijen, inelastic markets hypothesis [WP][V]"
        lab: "Intermediary-factor pricing test."
        project:
          title: "Flow-impact estimation"
          brief: >-
            Estimate price impact of index inclusion flows from a constructed event set
            (bring-your-own-data), and relate the multiplier to the inelastic-markets
            prediction.
          deliverable: "Code plus research note."
          grading: both
      - id: AP7
        title: "Behavioral Finance"
        tier: M
        hours: 80
        prereqs: [AP5, E3]
        core: >-
          Noise-trader risk, over- and under-reaction models, sentiment, survey
          expectations, diagnostic expectations, risk vs. mispricing.
        sources:
          - "De Long, Shleifer, Summers & Waldmann (1990), JPE 98(4)"
          - "De Bondt & Thaler (1985), JF 40(3)"
          - "Barberis, Shleifer & Vishny (1998), JFE 49(3)"
          - "Daniel, Hirshleifer & Subrahmanyam (1998), JF 53(6)"
          - "Hong & Stein (1999), JF 54(6)"
          - "Baker & Wurgler (2006), JF 61(4)"
          - "Greenwood & Shleifer (2014), RFS 27(3)"
          - "Bordalo, Gennaioli, La Porta & Shleifer (2019), JF 74(6)"
        lab: "Survey expectations vs. rational forecasts."
        project:
          title: "Sentiment-index replication"
          brief: >-
            Rebuild a Baker–Wurgler-style sentiment index from open proxies, and test its
            conditional-return predictions with correct inference.
          deliverable: "Code plus note."
          grading: both
        debate: "Are anomalies compensation for risk or mispricing?"
      - id: AP8
        title: "Market Efficiency: The Full Debate"
        tier: M
        hours: 50
        prereqs: [AP7, FC3]
        core: >-
          Efficiency revisited with the full toolkit: joint-hypothesis problem, the
          Grossman–Stiglitz equilibrium, luck vs. skill, the economics of active
          management.
        sources:
          - "Fama (1991), JF 46(5)"
          - "Fama & French (2010), JF 65(5)"
          - "Berk & van Binsbergen (2015), JFE 118(1)"
          - "Grossman & Stiglitz (1980), AER 70(3)"
        lab: "Bootstrap luck-vs-skill test."
        project:
          title: "Debate brief"
          brief: >-
            Write both sides of 'Markets are efficient' to the program's debate standard,
            then cross-examine the opposing side's three strongest pieces of evidence.
          deliverable: "Debate brief."
          grading: rubric
        debate: "Are markets efficient?"

  - order: 11
    code: SC
    title: "Stochastic Calculus & Continuous Time"
    studio:
      id: STUDIO-SC
      tier: M
      requires: [SC2, M8]
      title: "SDE Simulation Library with Convergence Certification"
      hours: 50
      grading: autograder
      brief: >-
        Build Euler–Maruyama, Milstein and exact schemes for GBM, OU, CIR and Heston.
        Empirically certify strong and weak convergence orders, handle CIR boundary
        behaviour correctly, and document the failure modes.
      deliverables: ["SDE library", "Convergence certificates", "Failure-mode report"]
    modules:
      - id: SC1
        title: "Stochastic Processes"
        tier: M
        hours: 100
        prereqs: [M6]
        core: >-
          Brownian motion and its construction, quadratic variation, continuous-time
          martingales, the Markov property, stopping times, reflection principle.
        sources:
          - "Shreve, Stochastic Calculus for Finance II (2004)"
          - "Karatzas & Shreve, Brownian Motion and Stochastic Calculus, 2nd ed. (1991)"
        lab: "Quadratic-variation convergence."
        project:
          title: "Reflection principle verified"
          brief: >-
            Prove the reflection principle and the running-maximum distribution, then
            verify both against simulation with proper discretization-bias handling.
          deliverable: "Proof plus verification."
          grading: both
      - id: SC2
        title: "Itô Calculus & SDEs"
        tier: M
        hours: 100
        prereqs: [SC1]
        core: >-
          The Itô integral, Itô's lemma, GBM, Ornstein–Uhlenbeck, existence and
          uniqueness, Euler–Maruyama and Milstein.
        sources:
          - "Øksendal, Stochastic Differential Equations, 6th ed. (2003)"
          - "Kloeden & Platen, Numerical Solution of Stochastic Differential Equations (1992)"
        lab: "Euler–Maruyama strong vs. weak convergence."
        project:
          title: "Itô derivations workbook"
          brief: >-
            Derive the dynamics of ten transformed processes (log price, bond price,
            ratios), and verify each numerically.
          deliverable: "Workbook."
          grading: both
      - id: SC3
        title: "Change of Measure"
        tier: M
        hours: 80
        prereqs: [SC2]
        core: >-
          Girsanov's theorem, martingale representation, the risk-neutral measure,
          change of numeraire, the forward measure.
        sources:
          - "Geman, El Karoui & Rochet (1995), Journal of Applied Probability 32(2)"
        lab: "Importance sampling via Girsanov for deep-OTM options."
        project:
          title: "Numeraire toolkit"
          brief: >-
            Price an exchange option and a quanto under appropriate numeraires, and
            verify against Monte Carlo under the original measure.
          deliverable: "Code plus derivations."
          grading: both
      - id: SC4
        title: "PDEs & Feynman–Kac"
        tier: M
        hours: 80
        prereqs: [SC2, M8]
        core: >-
          Kolmogorov equations, Feynman–Kac, boundary conditions, explicit / implicit /
          Crank–Nicolson schemes and their stability.
        sources:
          - "Wilmott, Howison & Dewynne, The Mathematics of Financial Derivatives (1995)"
        lab: "Crank–Nicolson heat-equation solver."
        project:
          title: "PDE pricer"
          brief: >-
            Build a Crank–Nicolson pricer with Rannacher smoothing for European and
            barrier options, and certify its convergence order.
          deliverable: "Tested pricer."
          grading: autograder
      - id: SC5
        title: "Jumps & Lévy Processes"
        tier: D
        hours: 80
        prereqs: [SC2]
        core: >-
          Poisson and compound Poisson processes, jump-diffusion, the Lévy–Khintchine
          representation, Variance Gamma, CGMY, characteristic-function pricing.
        sources:
          - "Merton (1976), JFE 3(1-2)"
          - "Madan, Carr & Chang (1998), European Finance Review 2(1)"
          - "Cont & Tankov, Financial Modelling with Jump Processes (2004)"
        lab: "Jump-induced smile."
        project:
          title: "Lévy model calibration"
          brief: >-
            Calibrate Merton and Variance Gamma models to an embedded option surface,
            and compare fit, stability and parameter identification.
          deliverable: "Calibration code plus report."
          grading: both
      - id: SC6
        title: "Stochastic Control"
        tier: M
        hours: 80
        prereqs: [SC2, M7]
        core: >-
          Dynamic programming in continuous time, the HJB equation, verification
          theorems, the Merton portfolio and consumption problem.
        sources:
          - "Merton (1969), REStat 51(3)"
          - "Merton (1971), JET 3(4)"
          - "Pham, Continuous-time Stochastic Control and Optimization with Financial Applications (2009)"
        lab: "Merton fraction vs. simulated expected utility."
        project:
          title: "HJB solver"
          brief: >-
            Solve the Merton problem with a borrowing constraint numerically via
            policy iteration on the HJB equation, and verify against the unconstrained
            closed form.
          deliverable: "Tested solver."
          grading: autograder

  - order: 12
    code: DV
    title: "Derivatives & Volatility"
    studio:
      id: STUDIO-DV
      tier: M
      requires: [DV2, DV4, DV5]
      title: "Volatility Desk"
      hours: 70
      grading: both
      brief: >-
        Calibrate an arbitrage-free SVI surface and a Heston model (priced with the DV4
        Fourier engine) to an embedded option snapshot, price a variance swap by static replication, run a
        delta-hedged book through historical paths, and attribute P&L to gamma, vega,
        theta and hedging error.
      deliverables: ["Surface and model code", "Variance-swap pricer", "P&L attribution report"]
    modules:
      - id: DV1
        title: "Continuous-Time Arbitrage Pricing"
        tier: M
        hours: 100
        prereqs: [FC2, SC3]
        core: >-
          Black–Scholes–Merton by replication and by change of measure, Greeks,
          dynamic hedging, discrete-hedging error, the hedging P&L identity.
        sources:
          - "Black & Scholes (1973), JPE 81(3)"
          - "Merton (1973), Bell Journal of Economics and Management Science 4(1)"
        lab: "Delta-hedging simulator with discrete rebalancing and costs."
        project:
          title: "Hedging-error study"
          brief: >-
            Measure hedging error vs. rebalancing frequency and transaction costs, and
            verify the theoretical error scaling.
          deliverable: "Code plus report."
          grading: both
      - id: DV2
        title: "The Volatility Surface"
        tier: M
        hours: 80
        prereqs: [DV1]
        core: >-
          Smile and skew, static-arbitrage conditions, SVI, local volatility,
          risk-neutral densities.
        sources:
          - "Gatheral, The Volatility Surface (2006)"
          - "Gatheral & Jacquier (2014), Quantitative Finance 14(1)"
          - "Dupire (1994), Risk 7(1)"
          - "Breeden & Litzenberger (1978), Journal of Business 51(4)"
        lab: "Risk-neutral density extraction."
        project:
          title: "Arbitrage-free surface builder"
          brief: >-
            Fit SVI slices with no-butterfly and no-calendar constraints, extract local
            vol, and prove the surface is arbitrage-free on a dense grid.
          deliverable: "Tested builder."
          grading: autograder
      - id: DV3
        title: "Stochastic & Rough Volatility"
        tier: D
        hours: 90
        prereqs: [DV2, SC5]
        core: >-
          Heston, SABR, Bergomi-type forward-variance models, rough volatility and the
          evidence for it.
        sources:
          - "Heston (1993), RFS 6(2)"
          - "Gatheral, Jaisson & Rosenbaum (2018), Quantitative Finance 18(6)"
          - "Bayer, Friz & Gatheral (2016), Quantitative Finance 16(6)"
        lab: "Heston via characteristic function."
        project:
          title: "Rough-vol estimation"
          brief: >-
            Estimate the Hurst parameter of log realized variance on open data, with
            honest treatment of measurement error, and assess the evidence.
          deliverable: "Code plus research note."
          grading: both
        debate: "Is volatility rough?"
      - id: DV4
        title: "Numerical Pricing (C++)"
        tier: M
        hours: 130
        prereqs: [DV1, M8, SC4, CS5]
        core: >-
          Trees, finite differences, Monte Carlo, Longstaff–Schwartz, Fourier (Carr–Madan,
          COS), adjoint algorithmic differentiation.
        sources:
          - "Boyle (1977), JFE 4(3)"
          - "Longstaff & Schwartz (2001), RFS 14(1)"
          - "Carr & Madan (1999), Journal of Computational Finance 2(4)"
          - "Fang & Oosterlee (2008), SIAM Journal on Scientific Computing 31(2)"
          - "Giles & Glasserman (2006), Risk"
        lab: "One American option priced four ways."
        project:
          title: "Atlas A6: pricing library"
          brief: >-
            Add BSM, binomial, PDE, Monte Carlo and LSMC pricers with Greeks to Atlas,
            with a C++ kernel behind a Python API and cross-method consistency tests.
          deliverable: "Atlas at milestone A6."
          grading: autograder
          atlas: A6
      - id: DV5
        title: "Variance Risk Premium & Volatility Trading"
        tier: M
        hours: 70
        prereqs: [DV2, F2]
        core: >-
          Variance swaps and static replication, VIX construction, the variance risk
          premium, option returns, tail-hedging economics, the February 2018 short-vol
          blow-up.
        sources:
          - "Demeterfi, Derman, Kamal & Zou (1999), Goldman Sachs Quantitative Strategies note"
          - "Cboe VIX methodology white paper (primary)"
          - "Carr & Wu (2009), RFS 22(3)"
          - "Bollerslev, Tauchen & Zhou (2009), RFS 22(11)"
          - "Coval & Shumway (2001), JF 56(3)"
          - "Israelov, protective-put evidence [V]"
        lab: "Replicate VIX from an embedded option chain."
        project:
          title: "Short-vol strategy audit"
          brief: >-
            Backtest a systematic short-variance strategy with realistic margin and
            costs, then stress it through 2008, 2018 and 2020 analogues, and report the
            true risk-adjusted return.
          deliverable: "Backtest plus audit memo."
          grading: both
        debate: "Is short volatility a free lunch?"
      - id: DV6
        title: "Exotics, Structured Products & Dealer Hedging"
        tier: M
        hours: 70
        prereqs: [DV2, DV4]
        core: >-
          Barriers, Asians, lookbacks, autocallables, dealer gamma positioning,
          hedging flows and their market footprint.
        sources:
          - "Ni, Pearson & Poteshman (2005), JFE 78(1)"
          - "Baltussen, Da, Lammers & Martens (2021), JFE 142(1)"
        lab: "Dealer gamma-exposure simulator (SIMULATED)."
        project:
          title: "Autocallable pricer and risk report"
          brief: >-
            Price an autocallable by Monte Carlo under local volatility, compute its
            Greeks, and explain the dealer's hedging exposure across spot levels.
          deliverable: "Pricer plus risk report."
          grading: both

  - order: 13
    code: CR
    title: "Credit"
    studio:
      id: STUDIO-CR
      tier: M
      requires: [CR1, CR4]
      title: "Credit Analyst Desk"
      hours: 50
      grading: both
      brief: >-
        For a set of issuers with public filings, compute structural-model default
        probabilities, decompose spreads into expected loss and risk premium, build a
        distressed-recovery waterfall for one issuer, and write a relative-value
        recommendation.
      deliverables: ["Model code", "Spread decomposition", "Recovery analysis", "RV memo"]
