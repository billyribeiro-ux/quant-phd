        introduces:
          barrier-option: "Barrier option"
          asian-option: "Asian option"
          lookback-option: "Lookback option"
          autocallable: "Autocallable note"
          dealer-gamma-exposure: "Dealer gamma exposure"
          hedging-flow-footprint: "Market footprint of dealer hedging flows"
        sources:
          - "Ni, Pearson & Poteshman (2005), 'Stock Price Clustering on Option Expiration Dates', JFE 78(1)"
          - "Baltussen, Da, Lammers & Martens (2021), JFE 142(1)"
        lab: "Dealer gamma-exposure simulator (SIMULATED)."
        project:
          title: "Autocallable pricer and risk report"
          brief: >-
            Price an autocallable by Monte Carlo under local volatility, compute its
            Greeks, and explain the dealer's hedging exposure across spot levels.
          deliverable: "Pricer plus risk report."
          grading: both

