  - order: 12
    code: DV
    title: "Derivatives & Volatility"
    studio:
      id: STUDIO-DV
      tier: M
      requires: [DV2, DV4, DV5]
      title: "Volatility Desk"
      hours: 70
      grading: both
      brief: >-
        Calibrate an arbitrage-free SVI surface and a Heston model (priced with the DV4
        Fourier engine) to an embedded option snapshot, price a variance swap by static replication, run a
        delta-hedged book through historical paths, and attribute P&L to gamma, vega,
        theta and hedging error.
      deliverables: ["Surface and model code", "Variance-swap pricer", "P&L attribution report"]
    modules:
      - id: DV1
        title: "Continuous-Time Arbitrage Pricing"
        tier: M
        hours: 100
        prereqs: [FC2, SC3]
        core: >-
          Black–Scholes–Merton by replication and by change of measure, Greeks,
          dynamic hedging, discrete-hedging error, the hedging P&L identity.
        introduces:
          dynamic-replication: "Dynamic replication"
          bsm-pde: "Black–Scholes–Merton PDE"
          option-greeks: "Option Greeks (delta, gamma, vega, theta)"
          delta-hedging: "Delta hedging"
          discrete-hedging-error: "Discrete-rebalancing hedging error"
          gamma-theta-pnl-identity: "Hedging P&L identity (gamma, theta and realized variance)"
        sources:
          - "Black & Scholes (1973), JPE 81(3)"
          - "Merton (1973), Bell Journal of Economics and Management Science 4(1)"
        lab: "Delta-hedging simulator with discrete rebalancing and costs."
        project:
          title: "Hedging-error study"
          brief: >-
            Measure hedging error vs. rebalancing frequency and transaction costs, and
            verify the theoretical error scaling.
          deliverable: "Code plus report."
          grading: both
      - id: DV2
        title: "The Volatility Surface"
        tier: M
        hours: 80
        prereqs: [DV1]
        core: >-
          Smile and skew, static-arbitrage conditions, SVI, local volatility,
          risk-neutral densities.
        introduces:
          volatility-smile: "Volatility smile and skew"
          butterfly-arbitrage: "Butterfly (strike) arbitrage"
          calendar-arbitrage: "Calendar arbitrage"
          svi-parameterization: "SVI parameterization"
          local-volatility: "Local volatility (Dupire)"
          risk-neutral-density: "Risk-neutral density (Breeden–Litzenberger)"
        sources:
          - "Gatheral, The Volatility Surface (2006)"
          - "Gatheral & Jacquier (2014), Quantitative Finance 14(1)"
          - "Dupire (1994), Risk 7(1)"
          - "Breeden & Litzenberger (1978), Journal of Business 51(4)"
        lab: "Risk-neutral density extraction."
        project:
          title: "Arbitrage-free surface builder"
          brief: >-
            Fit SVI slices with no-butterfly and no-calendar constraints, extract local
            vol, and prove the surface is arbitrage-free on a dense grid.
          deliverable: "Tested builder."
          grading: autograder
      - id: DV3
        title: "Stochastic & Rough Volatility"
        tier: D
        hours: 90
        prereqs: [DV2, SC5]
        core: >-
          Heston, SABR, Bergomi-type forward-variance models, rough volatility and the
          evidence for it.
        introduces:
          heston-model: "Heston stochastic-volatility model"
          forward-variance-model: "Forward-variance (Bergomi-type) models"
          rough-volatility: "Rough volatility"
          hurst-exponent-estimation: "Hurst-exponent estimation"
        sources:
          - "Heston (1993), RFS 6(2)"
          - "Gatheral, Jaisson & Rosenbaum (2018), Quantitative Finance 18(6)"
          - "Bayer, Friz & Gatheral (2016), Quantitative Finance 16(6)"
        lab: "Heston via characteristic function."
        project:
          title: "Rough-vol estimation"
          brief: >-
            Estimate the Hurst parameter of log realized variance on open data, with
            honest treatment of measurement error, and assess the evidence.
          deliverable: "Code plus research note."
          grading: both
        debate: "Is volatility rough?"
      - id: DV4
        title: "Numerical Pricing (C++)"
        tier: M
        hours: 130
        prereqs: [DV1, M8, SC4, CS5]
        core: >-
          Trees, finite differences, Monte Carlo, Longstaff–Schwartz, Fourier (Carr–Madan,
          COS), adjoint algorithmic differentiation.
        introduces:
          trinomial-tree: "Lattice pricing beyond the binomial (trinomial trees)"
          early-exercise-boundary: "Early-exercise boundary"
          longstaff-schwartz-lsmc: "Longstaff–Schwartz least-squares Monte Carlo"
          carr-madan-fft: "Carr–Madan FFT pricing"
          cos-method: "COS method"
          adjoint-algorithmic-differentiation: "Adjoint algorithmic differentiation"
          cross-method-pricing-consistency: "Cross-method pricing consistency tests"
        sources:
          - "Boyle (1977), JFE 4(3)"
          - "Longstaff & Schwartz (2001), RFS 14(1)"
          - "Carr & Madan (1999), Journal of Computational Finance 2(4)"
          - "Fang & Oosterlee (2009), SIAM Journal on Scientific Computing 31(2)"
          - "Giles & Glasserman (2006), Risk"
        lab: "One American option priced four ways."
        project:
          title: "Atlas A6: pricing library"
          brief: >-
            Add BSM, binomial, PDE, Monte Carlo and LSMC pricers with Greeks to Atlas,
            with a C++ kernel behind a Python API and cross-method consistency tests.
          deliverable: "Atlas at milestone A6."
          grading: autograder
          atlas: A6
      - id: DV5
        title: "Variance Risk Premium & Volatility Trading"
        tier: M
        hours: 70
        prereqs: [DV2, F2]
        core: >-
          Variance swaps and static replication, VIX construction, the variance risk
          premium, option returns, tail-hedging economics, the February 2018 short-vol
          blow-up.
        introduces:
          variance-swap: "Variance swap"
          variance-static-replication: "Static replication of variance (log contract)"
          vix-construction: "VIX construction"
          variance-risk-premium: "Variance risk premium"
          delta-hedged-option-returns: "Delta-hedged option returns"
          tail-hedging-economics: "Tail-hedging economics"
          short-vol-blowup-2018: "The February 2018 short-volatility blow-up"
        sources:
          - "Demeterfi, Derman, Kamal & Zou (1999), 'A Guide to Volatility and Variance Swaps', Journal of Derivatives 6(4)"
          - "Cboe VIX methodology white paper (primary)"
          - "Carr & Wu (2009), RFS 22(3)"
          - "Bollerslev, Tauchen & Zhou (2009), RFS 22(11)"
          - "Coval & Shumway (2001), JF 56(3)"
          - "Israelov (2018), 'Pathetic Protection: The Elusive Benefits of Protective Puts', Journal of Alternative Investments 21(3)"
        lab: "Replicate VIX from an embedded option chain."
        project:
          title: "Short-vol strategy audit"
          brief: >-
            Backtest a systematic short-variance strategy with realistic margin and
            costs, then stress it through 2008, 2018 and 2020 analogues, and report the
