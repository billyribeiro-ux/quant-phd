parts:
  - order: 18
    code: X
    title: "FX, Commodities & Digital Assets"
    studio:
      id: STUDIO-X
      tier: M
      requires: [X2, X3]
      title: "Carry Book with Crash-Risk Overlay"
      hours: 50
      grading: both
      brief: >-
        Run an FX and commodity carry book on open data, measure crash exposure
        (skewness, conditional beta to global risk), design an options or
        momentum-based overlay, and show its net cost/benefit across the 2008 and
        2024 yen-carry episodes.
      deliverables: ["Carry book", "Overlay design", "Episode analysis"]
    modules:
      - id: X1
        title: "FX Markets & Parity Conditions"
        tier: M
        hours: 60
        prereqs: [E8, S3]
        core: >-
          FX market structure, forward pricing, UIP and CIP in data, PPP and its slow
          convergence, the random-walk benchmark.
        sources:
          - "Meese & Rogoff (1983), Journal of International Economics 14(1-2)"
          - "Rogoff (1996), 'The Purchasing Power Parity Puzzle', JEL 34(2)"
          - "BIS Triennial Central Bank Survey (primary)"
        lab: "Random walk vs. fundamentals models out of sample."
        project:
          title: "Meese–Rogoff re-run"
          brief: >-
            Re-run the Meese–Rogoff horse race on modern open data with proper
            real-time discipline, and report where the random walk still wins.
          deliverable: "Code plus note."
          grading: both
      - id: X2
        title: "Currency Risk Premia"
        tier: M
        hours: 70
        prereqs: [X1, F3]
        core: "Carry, crash risk, FX momentum and value, the dollar factor, the peso problem."
        sources:
          - "Lustig, Roussanov & Verdelhan (2011), RFS 24(11)"
          - "Menkhoff, Sarno, Schmeling & Schrimpf (2012), JF 67(2)"
          - "Brunnermeier, Nagel & Pedersen (2008), NBER Macroeconomics Annual 23"
          - "Menkhoff, Sarno, Schmeling & Schrimpf (2012), JFE 106(3)"
          - "Menkhoff, Sarno, Schmeling & Schrimpf (2017), 'Currency Value', RFS 30(2)"
          - "Verdelhan (2018), JF 73(1)"
          - "Burnside, Eichenbaum, Kleshchelski & Rebelo (2011), RFS 24(3)"
        lab: "Carry-crash simulator."
        project:
          title: "Currency factor replication"
          brief: >-
            Replicate HML-FX and the dollar factor on open data, and test whether
            global FX volatility prices the carry cross-section.
          deliverable: "Code plus note."
          grading: both
      - id: X3
        title: "Commodities"
        tier: M
        hours: 70
        prereqs: [FC2, F3]
        core: >-
          The theory of storage, convenience yield, hedging pressure, roll yield vs.
          spot return, financialization, oil-shock identification.
        sources:
          - "Kaldor (1939), Review of Economic Studies 7(1)"
          - "Working (1949), 'The Theory of Price of Storage', AER 39(6)"
          - "Brennan (1958), 'The Supply of Storage', AER 48(1)"
          - "de Roon, Nijman & Veld (2000), JF 55(3)"
          - "Gorton & Rouwenhorst (2006), FAJ 62(2)"
          - "Erb & Harvey (2006), FAJ 62(2)"
          - "Tang & Xiong (2012), FAJ 68(6)"
          - "Kilian (2009), AER 99(3)"
        lab: "Roll yield vs. spot return decomposition."
        project:
          title: "Oil-shock decomposition"
          brief: >-
            Re-estimate a Kilian-style structural VAR separating supply, aggregate
            demand and oil-specific demand shocks, and apply it to a recent episode.
          deliverable: "Code plus memo."
          grading: both
      - id: X4
        title: "Digital Assets as a Macro Asset"
        tier: M
        hours: 40
        prereqs: [X1, F2]
        core: >-
          Crypto risk and return factors, stablecoin mechanics and reserve assets,
          correlation regimes with risk assets. Evidence graded strictly.
        sources:
          - "Liu & Tsyvinski (2021), RFS 34(6)"
          - "Liu, Tsyvinski & Wu (2022), JF 77(2)"
        lab: "Crypto factor exposures."
        project:
          title: "Stablecoin reserve stress test"
          brief: >-
            Model a fiat-backed stablecoin's reserve portfolio under redemption runs and
            rate shocks, and find the run size that breaks the peg.
          deliverable: "Model plus memo."
          grading: both

  - order: 19
    code: PM
    title: "Private Markets & Real Estate"
    studio:
      id: STUDIO-PM
      tier: M
      requires: [PM1]
      title: "Fund Due Diligence"
      hours: 50
      grading: both
      brief: >-
        Given a PE fund's cash-flow history and terms, compute IRR, TVPI, DPI and
        Kaplan–Schoar PME vs. public benchmarks, model the fee and carry waterfall,
        detect IRR manipulation via subscription lines, and write an LP allocation
        recommendation.
      deliverables: ["Performance analytics", "Waterfall model", "LP memo"]
    modules:
      - id: PM1
        title: "Private Equity"
        tier: M
        hours: 60
        prereqs: [CF5, F7]
        core: >-
          Fund structure, IRR vs. PME, the PE-performance debate, fees and carry,
          subscription lines.
        sources:
          - "Kaplan & Schoar (2005), JF 60(4)"
          - "Harris, Jenkinson & Kaplan (2014), JF 69(5)"
          - "Phalippou & Gottschalg (2009), RFS 22(4)"
          - "Metrick & Yasuda (2010), RFS 23(6)"
        lab: "IRR manipulation with a subscription line."
        project:
          title: "PME engine"
          brief: >-
            Implement KS-PME, direct alpha and Long–Nickels PME, and test them on
            generated fund cash flows with known true alpha.
          deliverable: "Tested engine."
          grading: autograder
        debate: "Does private equity outperform public markets after fees?"
      - id: PM2
        title: "Venture Capital"
        tier: M
        hours: 50
        prereqs: [CF6, PM1]
        core: >-
          Staged financing, contract terms, power-law returns, selection bias in VC
          return data.
        sources:
          - "Kaplan & Strömberg (2003), REStud 70(2)"
          - "Korteweg & Sorensen (2010), RFS 23(10)"
          - "Gompers & Lerner, The Venture Capital Cycle, 2nd ed. (2004)"
        lab: "Power-law portfolio outcomes vs. fund size."
        project:
          title: "Term-sheet economics"
          brief: >-
            Model a cap table through three rounds with liquidation preferences,
            anti-dilution and option pools, and compute payoffs by exit value.
          deliverable: "Tested model."
          grading: autograder
      - id: PM3
        title: "Private Credit & Infrastructure"
        tier: M
        hours: 40
        prereqs: [PM1, CR1]
        core: >-
          Direct lending, BDCs, unitranche structures, infrastructure cash flows,
          smoothing and marking. Thin evidence base, graded strictly.
        sources:
          - "Registry seeded in Phase 0 by literature search; grades capped at C until replicated evidence is verified"
        lab: "Appraisal smoothing vs. public-market proxies."
        project:
          title: "Unsmoothing private credit"
          brief: >-
            Unsmooth a reported private-credit return series, and compare its true risk
            with a public leveraged-loan proxy.
          deliverable: "Code plus memo."
          grading: both
      - id: PM4
        title: "Real Estate Finance & Mortgage-Backed Securities"
        tier: M
        hours: 80
        prereqs: [FI1, CF4, DV1]
        core: >-
          Mortgage math, prepayment and negative convexity, agency MBS, REITs and cap
          rates, the housing boom and bust.
        sources:
          - "Schwartz & Torous (1989), JF 44(2)"
          - "Stanton (1995), RFS 8(3)"
          - "Mian & Sufi (2009), QJE 124(4)"
        lab: "Negative convexity of a pass-through."
        project:
          title: "MBS pricer"
          brief: >-
            Price an agency pass-through by Monte Carlo with a rate-driven prepayment
            model, and compute OAS, effective duration and convexity.
          deliverable: "Tested pricer."
          grading: autograder

  - order: 20
    code: GM
    title: "Global Macro Trading"
    studio:
      id: STUDIO-GM
      tier: M
      requires: [GM4, PR4]
      title: "Macro Fund Simulation"
      hours: 100
      grading: both
      brief: >-
        Run a paper macro fund through a sealed set of historical episodes revealed
        one period at a time, using only Atlas data available at each date: regime
        read (A18), trade construction (A20), sizing (PR3), risk (A12). Then write the
        post-mortem: decisions vs. outcomes, separating skill from luck.
      deliverables: ["Decision log", "Fund P&L", "Post-mortem"]
    modules:
      - id: GM1
        title: "Macro Data & Nowcasting"
        tier: M
        hours: 70
        prereqs: [S3, E5, QR1]
        core: "Real-time data, revisions, dynamic factor models, nowcasting, surprise indices."
        sources:
          - "Stock & Watson (2002), JASA 97(460)"
          - "Giannone, Reichlin & Small (2008), JME 55(4)"
          - "Croushore & Stark (2001), Journal of Econometrics 105(1)"
        lab: "Revised-data lookahead bias in a backtest."
        project:
          title: "Atlas A18: nowcasting and regime dashboard"
          brief: >-
            Add a real-time-vintage dynamic-factor nowcast, a regime classifier and a
            cross-asset monitor to Atlas.
          deliverable: "Atlas at milestone A18."
          grading: autograder
          atlas: A18
      - id: GM2
        title: "Regimes & the Business Cycle"
        tier: M
        hours: 60
        prereqs: [GM1]
        core: >-
          Recession dating and prediction, the yield-curve signal, Markov switching,
          stock–bond correlation regimes, inflation regimes and asset returns.
        sources:
          - "Estrella & Hardouvelis (1991), JF 46(2)"
          - "Estrella & Mishkin (1998), REStat 80(1)"
          - "Campbell, Sunderam & Viceira (2017), Critical Finance Review 6(2)"
          - "Campbell, Pflueger & Viceira (2020), JPE 128(8)"
          - "Neville et al., strategies for inflationary times [WP][V]"
        lab: "Stock–bond correlation sign flip."
        project:
          title: "Regime-conditional asset returns"
          brief: >-
            Classify historical regimes in real time (no look-ahead), and estimate
            asset-class returns by regime with honest small-sample inference.
          deliverable: "Code plus report."
          grading: both
      - id: GM3
        title: "Trading Monetary Policy"
        tier: M
        hours: 50
        prereqs: [E7, S6]
        core: "FOMC event studies, the pre-FOMC drift, information effects, policy divergence and FX."
        sources:
          - "Lucca & Moench (2015), JF 70(1)"
          - "Nakamura & Steinsson (2018), QJE 133(3)"
        lab: "FOMC event study."
        project:
          title: "Pre-FOMC drift: out-of-sample check"
          brief: >-
            Re-test the pre-FOMC drift on post-publication data, and report whether it
            survived.
          deliverable: "Code plus note."
          grading: both
      - id: GM4
        title: "Macro Strategy Construction"
        tier: M
        hours: 80
        prereqs: [GM2, FI3, X2, DV2, PR3]
        core: >-
          Expressing a view (curve trades, relative value, options vs. delta-one),
          carry and roll-down, convexity of expression, sizing, risk-reward asymmetry.
        sources:
          - "Ilmanen, Expected Returns (2011)"
          - "Pedersen, Efficiently Inefficient (2015)"
        lab: "Trade-expression comparator."
        project:
          title: "Atlas A20: macro trade-construction engine"
          brief: >-
            Add view → expression → sizing → scenario P&L to Atlas, reusing A5, A6, A11
            and A12.
          deliverable: "Atlas at milestone A20."
          grading: autograder
          atlas: A20
      - id: GM5
        title: "Crises as Mechanisms"
        tier: M
        hours: 80
        prereqs: [GM4, SR1]
        core: >-
          1992 ERM, 1997 Asia, 1998 LTCM/Russia, 2008, the 2010–12 euro crisis, the
          2013 taper tantrum, the 2015 CHF de-peg, March 2020, 2022 gilts/LDI, 2023 SVB,
          the 2024 yen-carry unwind. Each is taught as a causal mechanism from primary
          sources.
        sources:
          - "Primary official reports per episode (BIS, Bank of England, Federal Reserve, SNB, President's Working Group) [V]"
          - "Edwards (1999), Journal of Economic Perspectives 13(2)"
        lab: "Mechanism simulators per episode."
        project:
          title: "Crisis mechanism dossier"
          brief: >-
            For two episodes, build a mechanism map (leverage, funding, forced sellers,
            policy response) from primary documents, plus a simulator reproducing the
            core dynamic.
          deliverable: "Dossier plus simulators."
          grading: both

  - order: 21
    code: SR
    title: "Systemic Risk & Financial Stability"
    studio:
      id: STUDIO-SR
      tier: M
      requires: [SR3]
      title: "Financial Stability Report"
      hours: 40
      grading: rubric
      brief: >-
        Write a central-bank-style Financial Stability Report section using Atlas A19
        outputs. Identify the three largest current vulnerabilities from public data,
        with mechanisms, metrics and a prioritized policy recommendation.
      deliverables: ["FSR section"]
    modules:
      - id: SR1
        title: "Runs, Liquidity & Fire Sales"
        tier: M
        hours: 50
        prereqs: [BK1, E4]
        core: "Bank runs, liquidity spirals, fire sales, the run on repo."
        sources:
          - "Diamond & Dybvig (1983), JPE 91(3)"
          - "Brunnermeier & Pedersen (2009), RFS 22(6)"
          - "Shleifer & Vishny (2011), Journal of Economic Perspectives 25(1)"
          - "Gorton & Metrick (2012), JFE 104(3)"
        lab: "Margin-spiral simulator."
        project:
          title: "Run dynamics model"
          brief: >-
            Extend Diamond–Dybvig with uninsured-depositor information, and calibrate
            the run threshold to the 2023 regional-bank episode.
          deliverable: "Model plus memo."
          grading: both
      - id: SR2
        title: "Leverage Cycles"
        tier: D
        hours: 60
        prereqs: [SR1, AP6]
        core: "Endogenous leverage, procyclical balance sheets, macro models with a financial sector."
        sources:
          - "Geanakoplos (2010), NBER Macroeconomics Annual 24"
          - "Adrian & Shin (2010), Journal of Financial Intermediation 19(3)"
          - "Brunnermeier & Sannikov (2014), AER 104(2)"
        lab: "Procyclical-leverage simulation."
        project:
          title: "Leverage-cycle model"
          brief: >-
            Solve a two-period Geanakoplos collateral-equilibrium model, and show how
            margin shocks drive price crashes.
          deliverable: "Solver plus write-up."
          grading: both
      - id: SR3
        title: "Measuring Systemic Risk"
        tier: M
        hours: 50
        prereqs: [SR1, PR4]
        core: "CoVaR, SRISK, MES, network contagion."
        sources:
          - "Adrian & Brunnermeier (2016), AER 106(7)"
          - "Brownlees & Engle (2017), RFS 30(1)"
          - "Acharya, Pedersen, Philippon & Richardson (2017), RFS 30(1)"
          - "Acemoglu, Ozdaglar & Tahbaz-Salehi (2015), AER 105(2)"
        lab: "CoVaR estimation."
        project:
          title: "Atlas A19: systemic-risk monitor"
          brief: "Add CoVaR, SRISK and MES on open data, with alert thresholds, to Atlas."
          deliverable: "Atlas at milestone A19."
          grading: autograder
          atlas: A19
      - id: SR4
        title: "Regulation's Market Footprint"
        tier: M
        hours: 50
        prereqs: [SR1, FI4, LX2]
        core: >-
          Basel III, the SLR, Volcker, central clearing, dealer constraints and
          Treasury-market liquidity, post-2020 market reform.
        sources:
          - "Duffie (2020), 'Still the World's Safe Haven?', Hutchins Center Working Paper 62 [V]"
          - "Basel Committee and SEC rule texts (primary)"
        lab: "Balance-sheet cost of intermediation."
        project:
          title: "Regulatory-impact analysis"
          brief: >-
            Quantify how one rule (e.g., SLR treatment of Treasuries) changes dealer
            intermediation capacity, and evaluate the proposed reform.
          deliverable: "Analysis plus memo."
          grading: rubric
