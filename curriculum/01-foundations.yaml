parts:
  - order: 0
    code: P0
    title: "Orientation & Learning System"
    modules:
      - id: P0.1
        title: "How to Study This Program"
        tier: F
        hours: 6
        prereqs: []
        core: >-
          Evidence grades (T/A/B/C/D/X); how to read a paper (question, identification,
          data, inference, robustness); steelmanning; the project ladder; how Atlas
          compounds; the notation conventions.
        introduces:
          evidence-grade: "Evidence grade (T/A/B/C/D/X)"
          paper-anatomy: "Anatomy of a paper: question, identification, data, inference, robustness"
          identification: "Identification (the variation that pins down an estimate)"
          robustness-check: "Robustness check"
          replication: "Independent out-of-sample replication"
          steelmanning: "Steelmanning"
          project-ladder: "Four-rung project ladder"
          prerequisite-dag: "Prerequisite graph (DAG)"
          atlas-platform: "Atlas, the program-long research platform"
          citation-registry: "Verified citation registry and citation keys"
          notation-conventions: "Program notation conventions"
        sources:
          - "Dunlosky et al. (2013), Psychological Science in the Public Interest 14(1)"
          - "Keshav (2007), 'How to Read a Paper', ACM SIGCOMM CCR 37(3)"
        lab: "Navigate the prerequisite DAG; run a first Pyodide cell."
        project:
          title: "Paper teardown"
          brief: >-
            Take one assigned classic paper and produce a one-page structured teardown:
            question, mechanism, data, identification, main result with its locator,
            the weakest assumption, and the evidence grade it deserves.
          deliverable: "One-page teardown in the in-page template."
          grading: rubric
      - id: P0.2
        title: "Diagnostics, Mastery Gating & Spaced Retrieval"
        tier: F
        hours: 4
        prereqs: [P0.1]
        core: >-
          How placement tests let you skip what you already know; mastery thresholds;
          the spaced-retrieval scheduler; interleaved review; why rereading is a weak
          strategy and retrieval is a strong one.
        introduces:
          placement-test: "Placement test (test-out diagnostic)"
          mastery-threshold: "Mastery threshold"
          retrieval-practice: "Retrieval practice (the testing effect)"
          spaced-retrieval: "Spaced retrieval practice"
          interleaved-practice: "Interleaved practice"
          expertise-reversal-effect: "Expertise-reversal effect"
          fsrs-scheduler: "FSRS-family spaced-repetition scheduler"
        sources:
          - "Roediger & Karpicke (2006), Psychological Science 17(3)"
          - "Cepeda et al. (2006), Psychological Bulletin 132(3)"
          - "Rohrer & Taylor (2007), Instructional Science 35"
          - "Kalyuga, Ayres, Chandler & Sweller (2003), Educational Psychologist 38(1)"
        lab: "Take the program-wide placement diagnostic; the result unlocks test-out paths."
        project:
          title: "Personal study plan"
          brief: >-
            From your placement results and the track hour totals, build a dated study
            plan covering weekly hours, track choice, review cadence and milestones.
          deliverable: "Exported plan JSON plus a half-page rationale."
          grading: rubric

  - order: 1
    code: M
    title: "Mathematics"
    studio:
      id: STUDIO-M
      tier: U
      requires: [M7, M8]
      title: "Numerical Mathematics Library"
      hours: 60
      grading: autograder
      brief: >-
        Implement from scratch a root finder (Brent), a QP solver (active-set) and a
        Monte Carlo engine with antithetic and control variates. Verify each against
        SciPy to stated tolerances, and include a written proof of convergence for the
        root finder.
      deliverables: ["Python package with tests", "Proof write-up", "Benchmark report"]
    modules:
      - id: M1
        title: "Precalculus & Mathematical Reasoning"
        tier: F
        hours: 100
        prereqs: [P0.1]
        core: >-
          Algebra, functions, exponentials and logarithms (continuous compounding),
          sequences and series (annuities, perpetuities), sets, quantifiers, direct
          proof, contradiction, induction.
        introduces:
          exponential-and-logarithm: "Exponential and logarithm functions"
          compounding-frequency: "Compounding frequency and the effective annual rate"
          continuous-compounding: "Continuous compounding"
          present-value: "Present value and discounting"
          discount-factor: "Discount factor"
          geometric-series: "Geometric series"
          annuity: "Annuity"
          perpetuity: "Perpetuity"
          growing-perpetuity: "Growing perpetuity"
          amortization-schedule: "Loan amortization schedule"
          quantifiers: "Quantifiers and logical statements"
          direct-proof: "Direct proof"
          proof-by-contradiction: "Proof by contradiction"
          mathematical-induction: "Proof by induction"
        sources:
          - "Velleman, How to Prove It, 3rd ed. (2019)"
        lab: "Compounding-frequency convergence to e^{rt}."
        project:
          title: "Annuity and mortgage engine"
          brief: >-
            Derive the closed forms for annuity, perpetuity and growing-perpetuity values
            by induction and geometric series, then implement and test them, including a
            full amortization schedule.
          deliverable: "Proofs and a tested Python module."
          grading: both
      - id: M2
        title: "Single & Multivariable Calculus"
        tier: F
        hours: 300
        prereqs: [M1]
        core: >-
          Limits, derivatives, Taylor's theorem, integration, partial derivatives,
          gradients, Jacobians, Hessians, multiple integrals, implicit-function and
          envelope theorems.
        introduces:
          limit: "Limit"
          derivative: "Derivative"
          taylor-theorem: "Taylor's theorem with remainder"
          definite-integral: "Definite integral"
          partial-derivative: "Partial derivative"
          gradient: "Gradient"
          jacobian: "Jacobian matrix"
          hessian: "Hessian matrix"
          multiple-integral: "Multiple integral"
          implicit-function-theorem: "Implicit-function theorem"
          envelope-theorem: "Envelope theorem"
          finite-difference-derivative: "Finite-difference derivative approximation"
          automatic-differentiation: "Automatic differentiation"
        sources:
          - "Spivak, Calculus, 4th ed. (2008)"
          - "Hubbard & Hubbard, Vector Calculus, Linear Algebra, and Differential Forms, 5th ed. (2015)"
        lab: "Taylor expansion of a bond price: duration and convexity preview."
        project:
          title: "Sensitivity engine"
          brief: >-
            Build first- and second-order sensitivities for any differentiable pricing
            function, using analytic, finite-difference and automatic-differentiation
            approaches, and characterize where finite differences break.
          deliverable: "Tested module plus an error-analysis note."
          grading: both
      - id: M3
        title: "Linear Algebra"
        tier: F
        hours: 150
        prereqs: [M1]
        core: >-
          Vector spaces, linear maps, eigendecomposition, spectral theorem, SVD,
          positive-semidefinite matrices, projections, least-squares geometry, PCA.
        introduces:
          vector-space: "Vector space"
          linear-map: "Linear map and its matrix"
          eigendecomposition: "Eigendecomposition"
          spectral-theorem: "Spectral theorem for symmetric matrices"
          singular-value-decomposition: "Singular value decomposition (SVD)"
          positive-semidefinite-matrix: "Positive-semidefinite matrix"
          orthogonal-projection: "Orthogonal projection"
          least-squares-projection: "Least squares as orthogonal projection"
          principal-component-analysis: "Principal component analysis (PCA)"
          level-slope-curvature: "Level, slope and curvature factors of the yield curve"
          nearest-correlation-matrix: "Nearest correlation matrix"
          eigenvalue-clipping: "Eigenvalue clipping"
        sources:
          - "Axler, Linear Algebra Done Right, 4th ed. (2024)"
          - "Strang, Introduction to Linear Algebra, 6th ed. (2023)"
        lab: "PCA of the U.S. Treasury curve (embedded data): level, slope, curvature."
        project:
          title: "Covariance-matrix doctor"
          brief: >-
            Diagnose and repair non-PSD empirical correlation matrices (nearest-correlation
            projection, eigenvalue clipping). Compare the effect of each repair on
            downstream portfolio weights.
          deliverable: "Tested module plus a comparison report."
          grading: both
      - id: M4
        title: "Probability"
        tier: F
        hours: 120
        prereqs: [M2]
        core: >-
          Distributions, expectation, MGFs and characteristic functions, the multivariate
          normal, conditioning, LLN, CLT, heavy tails, and the failure of the CLT under
          infinite variance.
        introduces:
          random-variable: "Random variable and its distribution"
          expectation: "Expectation"
          variance: "Variance and standard deviation"
          independence: "Independence"
          correlation: "Covariance and correlation"
          covariance-matrix: "Covariance matrix"
          skewness: "Skewness (third standardized moment)"
          kurtosis: "Kurtosis (fourth standardized moment)"
          quantile-function: "Quantile function"
          moment-generating-function: "Moment-generating function"
          characteristic-function: "Characteristic function"
          normal-distribution: "Normal distribution"
          multivariate-normal: "Multivariate normal distribution"
          student-t-distribution: "Student-t distribution"
          conditional-expectation-elementary: "Conditional distribution and conditional expectation (elementary)"
          law-of-large-numbers: "Law of large numbers"
          central-limit-theorem: "Central limit theorem"
          heavy-tailed-distribution: "Heavy-tailed distribution"
          infinite-variance-clt-failure: "Failure of the CLT under infinite variance (stable limits)"
        sources:
          - "Blitzstein & Hwang, Introduction to Probability, 2nd ed. (2019)"
        lab: "Sample-mean behaviour under Gaussian, Student-t(3) and Cauchy draws."
        project:
          title: "Tail-risk simulator"
          brief: >-
            Simulate portfolio losses under multivariate Gaussian vs. multivariate
            Student-t returns with matched covariance. Quantify how the 99% loss estimate
            changes, and prove the moment conditions behind the result.
          deliverable: "Simulator plus a proof appendix."
          grading: both
      - id: M5
        title: "Real Analysis"
        tier: U
        hours: 130
        prereqs: [M2]
        core: >-
          Completeness of R, sequences and series, continuity, uniform convergence,
          compactness, metric spaces, fixed-point theorems (Banach), Riemann–Stieltjes.
        introduces:
          completeness-of-reals: "Completeness of the real numbers"
          cauchy-sequence: "Cauchy sequence"
          epsilon-delta-continuity: "Continuity (epsilon–delta)"
          uniform-convergence: "Uniform convergence"
          compactness: "Compactness"
          metric-space: "Metric space"
          contraction-mapping: "Contraction mapping"
          banach-fixed-point-theorem: "Banach fixed-point theorem"
          bellman-operator-contraction: "Contraction property of the discounted Bellman operator"
          value-function-iteration: "Value-function iteration with a certified error bound"
          riemann-stieltjes-integral: "Riemann–Stieltjes integral"
        sources:
          - "Abbott, Understanding Analysis, 2nd ed. (2015)"
          - "Rudin, Principles of Mathematical Analysis, 3rd ed. (1976)"
        lab: "Banach fixed-point iteration solving a Bellman equation."
        project:
          title: "Contraction-mapping solver"
          brief: >-
            Prove the Bellman operator for a discounted savings problem is a contraction,
            then implement value-function iteration with a certified error bound.
          deliverable: "Proof plus a tested solver."
          grading: both
      - id: M6
        title: "Measure-Theoretic Probability"
        tier: M
        hours: 150
        prereqs: [M4, M5]
        core: >-
          Sigma-algebras, Lebesgue integral, MCT and DCT, Fubini, Radon–Nikodym,
          conditional expectation as L2 projection, filtrations, discrete-time
          martingales, optional stopping, martingale convergence.
        introduces:
          sigma-algebra: "Sigma-algebra"
          probability-space: "Measure and probability space"
          lebesgue-integral: "Lebesgue integral"
          monotone-convergence-theorem: "Monotone convergence theorem"
          dominated-convergence-theorem: "Dominated convergence theorem"
          fubini-theorem: "Fubini's theorem"
          radon-nikodym-theorem: "Radon–Nikodym theorem"
          conditional-expectation-l2: "Conditional expectation as an L2 projection"
          filtration: "Filtration"
          martingale: "Martingale (discrete time)"
          stopping-time: "Stopping time"
          optional-stopping-theorem: "Optional stopping theorem"
          doob-maximal-inequality: "Doob's maximal inequality"
          martingale-convergence-theorem: "Martingale convergence theorem"
          doubling-strategy: "Doubling (martingale) betting strategy"
        sources:
          - "Williams, Probability with Martingales (1991)"
          - "Billingsley, Probability and Measure, anniversary ed. (2012)"
        lab: "Martingale betting-system simulator: why doubling strategies fail under finite capital."
        project:
          title: "Proof portfolio: martingales"
          brief: >-
            Write complete proofs of optional stopping (bounded case), Doob's maximal
            inequality, and the martingale convergence theorem, then verify each
            numerically on simulated paths.
          deliverable: "Typeset proofs plus verification notebook."
          grading: both
      - id: M7
        title: "Optimization"
        tier: F
        hours: 110
        prereqs: [M2, M3]
        core: >-
          Convex sets and functions, Lagrange multipliers, KKT conditions, duality,
          quadratic programming, dynamic programming and the Bellman equation.
        introduces:
          convex-set: "Convex set"
          convex-function: "Convex function"
          lagrange-multiplier: "Lagrange multiplier"
          kkt-conditions: "Karush–Kuhn–Tucker (KKT) conditions"
          lagrangian-duality: "Lagrangian duality"
          quadratic-programming: "Quadratic programming"
          mean-variance-optimization: "Mean-variance optimization as a quadratic program"
          linear-portfolio-constraints: "Linear portfolio constraints (box, turnover, sector)"
          principle-of-optimality: "Principle of optimality"
          bellman-equation: "Bellman equation"
        sources:
          - "Boyd & Vandenberghe, Convex Optimization (2004)"
          - "Stokey & Lucas, Recursive Methods in Economic Dynamics (1989)"
        lab: "Efficient frontier via QP with and without a short-sale constraint."
        project:
          title: "Constrained allocator"
          brief: >-
            Build a mean-variance allocator supporting box, turnover and sector
            constraints. Verify the KKT conditions hold at every returned solution.
          deliverable: "Tested module plus KKT-certificate output."
          grading: autograder
      - id: M8
        title: "Numerical Methods & Scientific Computing"
        tier: U
        hours: 110
        prereqs: [M2, M3, CS1, FC2]
        core: >-
          IEEE 754, conditioning and stability, root finding, linear solvers,
          interpolation, quadrature, finite differences, random-number generation,
          Monte Carlo and variance reduction.
        introduces:
          ieee-754-floating-point: "IEEE 754 floating-point arithmetic"
          condition-number: "Conditioning and condition number"
          numerical-stability: "Numerical stability of an algorithm"
          catastrophic-cancellation: "Catastrophic cancellation"
          bracketing-root-finder: "Bracketing root finders (bisection, Brent)"
          newtons-method: "Newton's method"
          cholesky-decomposition: "LU and Cholesky decompositions"
          cubic-spline-interpolation: "Cubic-spline interpolation"
          numerical-quadrature: "Numerical quadrature"
          pseudo-random-number-generator: "Pseudo-random number generator"
          monte-carlo-integration: "Monte Carlo integration and its root-n error"
          antithetic-variates: "Antithetic variates"
          control-variates: "Control variates"
          importance-sampling: "Importance sampling"
          robust-implied-vol-inversion: "Robust implied-volatility inversion (bracketing with Newton acceleration)"
        sources:
          - "Goldberg (1991), 'What Every Computer Scientist Should Know About Floating-Point Arithmetic', ACM Computing Surveys 23(1)"
          - "Glasserman, Monte Carlo Methods in Financial Engineering (2003)"
        lab: "Catastrophic cancellation; antithetic and control-variate efficiency."
        project:
          title: "Robust implied-volatility solver"
          brief: >-
            Build an implied-vol solver that never fails on valid inputs (deep ITM/OTM,
            near expiry), using bracketing with Newton acceleration. Stress it on a
            generated grid of a million inputs.
          deliverable: "Tested solver plus a failure-region report."
          grading: autograder

  - order: 2
    code: CS
    title: "Computing & Software Engineering"
    studio:
      id: STUDIO-CS
      tier: M
      requires: [CS2, CS5]
      title: "Limit Order Book Matching Engine"
      hours: 80
      grading: autograder
      brief: >-
        Build a price-time-priority matching engine (limit, market, cancel, modify) in
        C++ with Python bindings. Include deterministic replay of a message log,
        property-based tests, and latency benchmarks. MS2 and MS3 reuse it.
      deliverables: ["C++ engine + Python API", "Test suite", "Benchmark report"]
    modules:
      - id: CS1
        title: "Programming in Python from Zero"
        tier: F
        hours: 120
        prereqs: [P0.1]
        core: >-
          Types, control flow, functions, data structures, classes and protocols, type
          hints, errors, files, modules, NumPy and pandas fundamentals.
        introduces:
          python-function-scope: "Functions and scope"
          python-data-structures: "Built-in data structures (list, dict, set, tuple)"
          python-class: "Classes and objects"
          structural-protocol: "Protocols (structural subtyping)"
          type-hints: "Type hints and static type checking"
          python-exceptions: "Exceptions and error handling"
          python-modules-packages: "Modules and packages"
          numpy-vectorization: "NumPy arrays and vectorization"
          pandas-index-alignment: "pandas DataFrame and index alignment"
          simple-return: "Simple (arithmetic) return"
          log-return: "Log (continuously compounded) return"
          unit-test: "Unit test (pytest)"
        sources:
          - "Python Software Foundation, The Python Language Reference, Python 3.13 (primary)"
          - "Ramalho, Fluent Python, 2nd ed. (2022)"
        lab: "Vectorized returns computation vs. loops: correctness and speed."
        project:
          title: "Atlas A1: repository skeleton"
          brief: >-
            Create the Atlas package with typed modules, a CLI, a pytest suite,
            formatting and linting config, and CI. Every later Atlas milestone builds on
            this repository.
          deliverable: "Atlas repository at milestone A1."
          grading: autograder
          atlas: A1
      - id: CS2
        title: "Algorithms & Data Structures"
        tier: F
        hours: 130
        prereqs: [CS1]
        core: >-
          Complexity, arrays, hash maps, heaps, trees, graphs, sorting, searching,
          dynamic programming, and the data structures behind order books and event
          queues.
        introduces:
          big-o-complexity: "Asymptotic complexity (big-O)"
          hash-map: "Hash map"
          binary-heap: "Binary heap and priority queue"
          event-queue: "Event queue for discrete-event simulation"
          balanced-search-tree: "Balanced search tree"
          graph-traversal: "Graph traversal (BFS, DFS)"
          comparison-sorting: "Comparison sorting and its lower bound"
          binary-search: "Binary search"
          dynamic-programming: "Dynamic programming (algorithmic)"
          order-book-data-structure: "Order-book data structure (price levels with FIFO queues)"
          welford-algorithm: "Welford's online mean and variance"
          monotonic-deque: "Monotonic deque for rolling minimum and maximum"
          quantile-sketch: "Streaming quantile sketch"
        sources:
          - "Cormen, Leiserson, Rivest & Stein, Introduction to Algorithms, 4th ed. (2022)"
        lab: "Heap-based event queue vs. a sorted list at scale."
        project:
          title: "Streaming statistics library"
          brief: >-
            Implement O(1)-update rolling mean, variance (Welford), min/max (monotonic
            deque) and an approximate quantile sketch. Prove the correctness of Welford's
            update.
          deliverable: "Tested library plus proof."
          grading: both
      - id: CS3
        title: "Data, Databases & SQL"
        tier: F
        hours: 80
        prereqs: [CS1]
        core: >-
          The relational model, SQL, joins, window functions, ASOF joins, indexing,
          columnar storage, Parquet, DuckDB.
        introduces:
          relational-model: "Relational model"
          sql-join: "SQL joins"
          sql-window-function: "SQL window functions"
          asof-join: "ASOF join"
          database-index: "Database index"
          columnar-storage: "Columnar storage"
          parquet-format: "Parquet file format"
          point-in-time-data: "Point-in-time data"
          data-manifest: "Data manifest (source, licence, retrieval time, hash)"
        sources:
          - "Codd (1970), Communications of the ACM 13(6)"
          - "Raasveldt & Mühleisen (2019), 'DuckDB: an Embeddable Analytical Database', Proceedings of the 2019 International Conference on Management of Data"
        lab: "ASOF JOIN of trades to quotes in DuckDB-WASM."
        project:
          title: "Atlas A2: data layer"
          brief: >-
            Build the Atlas data layer: a DuckDB store with a point-in-time schema,
            ingestion for FRED, French, Shiller, Treasury and EDGAR, and a manifest with
            source, licence, retrieval time and hash.
          deliverable: "Atlas at milestone A2."
          grading: autograder
          atlas: A2
      - id: CS4
        title: "Software Engineering & Reproducible Research"
        tier: U
        hours: 80
        prereqs: [CS2, CS3]
        core: >-
          Git workflows, testing (unit, property-based, regression), typing, packaging,
          CI, environment pinning, determinism, code review.
        introduces:
          git-branching-workflow: "Git branching and pull-request workflow"
          property-based-testing: "Property-based testing"
          regression-test: "Regression test"
          continuous-integration: "Continuous integration"
          python-packaging: "Python packaging"
          dependency-pinning: "Dependency pinning and lock files"
          deterministic-computation: "Deterministic computation and seeded randomness"
          bit-for-bit-reproducibility: "Bit-for-bit reproducibility"
          code-review: "Code review"
        sources:
          - "Wilson et al. (2014), 'Best Practices for Scientific Computing', PLOS Biology 12(1)"
          - "Wilson et al. (2017), 'Good Enough Practices in Scientific Computing', PLOS Computational Biology 13(6)"
        lab: "A property-based test finds a bug a unit test missed."
        project:
          title: "Reproducibility audit"
          brief: >-
            Take a deliberately broken research repository (unpinned, non-deterministic,
            no tests) and make it reproduce bit-for-bit, documenting every fix.
          deliverable: "Fixed repository plus an audit log."
          grading: autograder
      - id: CS5
        title: "C++ & Systems for Finance"
        tier: M
        hours: 130
        prereqs: [CS2, CS4]
        core: >-
          Modern C++ (C++20): value semantics, RAII, templates, the STL, memory
          hierarchy, cache effects, compilation, Python bindings, WASM compilation.
        introduces:
          value-semantics: "Value semantics"
          raii: "Resource acquisition is initialization (RAII)"
          cpp-templates: "C++ templates and concepts"
          standard-template-library: "Standard Template Library containers and algorithms"
          memory-hierarchy: "Memory hierarchy and cache effects"
          struct-of-arrays: "Array-of-structs vs. struct-of-arrays layout"
          compilation-model: "C++ compilation and linking model"
          python-cpp-bindings: "Python bindings for C++"
          webassembly-compilation: "Compilation to WebAssembly"
        sources:
          - "Stroustrup, A Tour of C++, 3rd ed. (2022)"
          - "Drepper (2007), 'What Every Programmer Should Know About Memory'"
        lab: "Array-of-structs vs. struct-of-arrays cache benchmark."
        project:
          title: "C++ Monte Carlo kernel"
          brief: >-
            Port a Python Monte Carlo pricer to C++ with identical seeded output,
            expose it to Python, and document the speedup and where it comes from.
          deliverable: "C++ kernel, bindings, equivalence tests, benchmark."
          grading: autograder
      - id: CS6
        title: "Parallel & High-Performance Computing"
        tier: M
        hours: 90
        prereqs: [CS5, M8]
        core: >-
          Amdahl's law, threads vs. processes, SIMD, GPU programming model, parallel RNG
          streams, profiling, latency vs. throughput engineering.
        introduces:
          amdahls-law: "Amdahl's law"
          threads-vs-processes: "Threads vs. processes"
          python-gil: "Python's global interpreter lock"
          simd-vectorization: "SIMD vectorization"
          gpu-programming-model: "GPU programming model"
          parallel-rng-streams: "Independent parallel RNG streams"
          profiling: "Profiling"
          latency-vs-throughput: "Latency vs. throughput"
        sources:
          - "Amdahl (1967), 'Validity of the Single Processor Approach to Achieving Large Scale Computing Capabilities', AFIPS Spring Joint Computer Conference"
          - "Hennessy & Patterson, Computer Architecture: A Quantitative Approach, 6th ed. (2017)"
        lab: "Parallel Monte Carlo with independent RNG streams: reproducibility check."
        project:
          title: "Parallel risk run"
          brief: >-
            Parallelize a full-portfolio Monte Carlo VaR with reproducible RNG streams,
            achieving a measured speedup and reconciling the result to the serial run.
          deliverable: "Code, scaling plot, reconciliation test."
          grading: autograder

  - order: 3
    code: S
    title: "Statistics & Econometrics"
    studio:
      id: STUDIO-S
      tier: M
      requires: [S2, S3, S7]
      title: "Predictive-Regression Stress Test"
      hours: 50
      grading: both
      brief: >-
        Replicate the CAPE / dividend-yield return-predictability evidence on embedded
        Shiller data. Apply Stambaugh bias correction, HAC inference, out-of-sample
        R-squared, and multiple-testing adjustment across predictors. Write the
        referee-grade verdict.
      deliverables: ["Replication code", "Referee-style report"]
    modules:
      - id: S0
        title: "Exploratory Data Analysis & Visualization"
        tier: F
        hours: 50
        prereqs: [CS1]
        core: >-
          Distributions, robust summaries, outliers, missing data, stale prices and
          splits, graphical perception, how charts mislead.
        introduces:
          empirical-distribution: "Empirical distribution and histogram"
          robust-statistics: "Robust summary statistics (median, MAD, trimmed mean)"
          qq-plot: "Quantile–quantile plot"
          outlier-detection: "Outlier detection"
          missing-data-mechanisms: "Missing-data mechanisms (MCAR, MAR, MNAR)"
          stale-price: "Stale price"
          corporate-action-break: "Corporate-action break in a price series"
          anscombes-quartet: "Anscombe's quartet"
          graphical-perception: "Graphical perception ranking (Cleveland–McGill)"
          misleading-chart: "Misleading chart devices"
        sources:
          - "Tukey, Exploratory Data Analysis (1977)"
