        sources:
          - "Chevalier & Ellison (1997), JPE 105(6)"
          - "Sirri & Tufano (1998), JF 53(5)"
          - "Berk & Green (2004), JPE 112(6)"
          - "Ben-David, Franzoni & Moussawi (2018), JF 73(6)"
