parts:
  - order: 4
    code: E
    title: "Economics"
    studio:
      id: STUDIO-E
      tier: M
      requires: [E6, E7]
      title: "Central Bank Simulator"
      hours: 60
      grading: both
      brief: >-
        Estimate a Taylor rule on FRED data, solve and calibrate the three-equation
        New Keynesian model, and run policy counterfactuals (ZLB, forward guidance,
        supply shock). Defend the policy recommendation in a two-page memo.
      deliverables: ["Model code", "Counterfactual figures", "Policy memo"]
    modules:
      - id: E1
        title: "Microeconomics"
        tier: F
        hours: 120
        prereqs: [M2]
        core: >-
          Consumer and producer theory, demand and supply, elasticity, market
          structures, welfare, externalities, public goods.
        sources:
          - "Varian, Intermediate Microeconomics, 9th ed. (2014)"
        lab: "Comparative statics of a market equilibrium."
        project:
          title: "Market-structure lab"
          brief: >-
            Model an exchange-fee market under monopoly vs. Cournot vs. Bertrand
            competition, and quantify the welfare and fee outcomes.
          deliverable: "Model plus memo."
          grading: both
      - id: E2
        title: "Game Theory & Information Economics"
        tier: U
        hours: 110
        prereqs: [E1, M4]
        core: >-
          Nash and Bayesian-Nash equilibrium, adverse selection, signaling, screening,
          moral hazard, mechanism design, auctions.
        sources:
          - "Nash (1950), PNAS 36(1)"
          - "Akerlof (1970), QJE 84(3)"
          - "Spence (1973), QJE 87(3)"
          - "Rothschild & Stiglitz (1976), QJE 90(4)"
          - "Holmström (1979), Bell Journal of Economics 10(1)"
          - "Vickrey (1961), JF 16(1)"
          - "Milgrom & Weber (1982), Econometrica 50(5)"
          - "Fudenberg & Tirole, Game Theory (1991)"
        lab: "Winner's curse in a common-value auction."
        project:
          title: "Treasury auction design"
          brief: >-
            Simulate uniform-price vs. discriminatory auctions with strategic bidders
            and compare revenue, bid shading and allocative efficiency.
          deliverable: "Simulator plus a design memo."
          grading: both
      - id: E3
        title: "Decision Theory Under Risk & Ambiguity"
        tier: U
        hours: 70
        prereqs: [E1, M4]
        core: >-
          Expected utility, Arrow–Pratt risk aversion, stochastic dominance, Epstein–Zin
          recursive preferences, prospect theory, ambiguity aversion.
        sources:
          - "Pratt (1964), Econometrica 32(1-2)"
          - "Kahneman & Tversky (1979), Econometrica 47(2)"
          - "Epstein & Zin (1989), Econometrica 57(4)"
          - "Ellsberg (1961), QJE 75(4)"
          - "Gilboa & Schmeidler (1989), Journal of Mathematical Economics 18(2)"
        lab: "Certainty equivalents of one gamble under four preference models."
        project:
          title: "Preference elicitation"
          brief: >-
            Design and run an in-page lottery questionnaire, estimate the participant's
            risk-aversion and loss-aversion parameters by MLE, and report the
            uncertainty.
          deliverable: "Instrument plus estimation report."
          grading: both
      - id: E4
        title: "General Equilibrium & Information in Markets"
        tier: M
        hours: 100
        prereqs: [E2, E3, M7]
        core: >-
          Arrow–Debreu, complete vs. incomplete markets, rational expectations,
          the Grossman–Stiglitz paradox, the no-trade theorem.
        sources:
          - "Mas-Colell, Whinston & Green, Microeconomic Theory (1995)"
          - "Muth (1961), Econometrica 29(3)"
          - "Grossman & Stiglitz (1980), AER 70(3)"
          - "Milgrom & Stokey (1982), JET 26(1)"
        lab: "Grossman–Stiglitz equilibrium: fraction informed vs. information cost."
        project:
          title: "Price-informativeness model"
          brief: >-
            Solve a noisy rational-expectations model numerically, and show how price
            informativeness responds to noise-trader volume and information cost.
          deliverable: "Solver plus write-up."
          grading: both
      - id: E5
        title: "Macroeconomics I: Aggregates, Cycles & Policy"
        tier: U
        hours: 110
        prereqs: [E1]
        core: >-
          National accounts, growth accounting, the Solow model, IS-LM and AD-AS, the
          Phillips curve and the natural rate, central banking and fiscal policy basics.
        sources:
          - "Solow (1956), QJE 70(1)"
          - "Hicks (1937), Econometrica 5(2)"
          - "Friedman (1968), AER 58(1)"
          - "Phelps (1968), JPE 76(4)"
          - "Blanchard, Macroeconomics, 8th ed. (2021)"
        lab: "Growth accounting on embedded national-accounts data."
        project:
          title: "Macro dashboard v0"
          brief: >-
            Assemble GDP, inflation, unemployment, policy-rate and term-spread series
            from Atlas into a documented dashboard, with a one-page cycle diagnosis.
          deliverable: "Dashboard plus diagnosis."
          grading: rubric
      - id: E6
        title: "Macroeconomics II: Dynamic General Equilibrium"
        tier: M
        hours: 150
        prereqs: [E5, M7, S3]
        core: >-
          RBC, New Keynesian models, determinacy, heterogeneous-agent (HANK) models,
          solution and estimation methods.
        sources:
          - "Kydland & Prescott (1982), Econometrica 50(6)"
          - "Clarida, Galí & Gertler (1999), JEL 37(4)"
          - "Galí, Monetary Policy, Inflation, and the Business Cycle, 2nd ed. (2015)"
          - "Woodford, Interest and Prices (2003)"
          - "Kaplan, Moll & Violante (2018), AER 108(3)"
        lab: "Three-equation NK impulse responses."
        project:
          title: "NK model solver"
          brief: >-
            Solve the NK model by undetermined coefficients and numerically, verify the
            determinacy (Taylor) principle, and reproduce the canonical impulse
            responses.
          deliverable: "Tested solver plus a figure set."
          grading: autograder
      - id: E7
        title: "Monetary Economics & Central Banking"
        tier: M
        hours: 130
        prereqs: [E6]
        core: >-
          Policy rules, time inconsistency, the ZLB, operating frameworks (floor vs.
          corridor), QE channels and evidence, shock identification, r-star, the fiscal
          theory of the price level, the 2021–23 inflation.
        sources:
          - "Taylor (1993), Carnegie-Rochester Conference Series 39"
          - "Kydland & Prescott (1977), JPE 85(3)"
          - "Barro & Gordon (1983), JPE 91(4)"
          - "Gagnon, Raskin, Remache & Sack (2011), International Journal of Central Banking 7(1)"
          - "Krishnamurthy & Vissing-Jorgensen (2011), Brookings Papers on Economic Activity"
          - "Bernanke (2020), AER 110(4)"
          - "Romer & Romer (2004), AER 94(4)"
          - "Gertler & Karadi (2015), AEJ: Macroeconomics 7(1)"
          - "Nakamura & Steinsson (2018), QJE 133(3)"
          - "Holston, Laubach & Williams (2017), Journal of International Economics 108"
          - "Cochrane, The Fiscal Theory of the Price Level (2023)"
          - "Bernanke & Blanchard, pandemic-era inflation [WP][V]"
        lab: "Taylor-rule prescriptions vs. the realized policy rate."
        project:
          title: "Monetary-shock identification"
          brief: >-
            Construct high-frequency policy surprises from embedded futures-implied
            rates, estimate their effects with local projections, and compare the result
            with the Romer–Romer narrative series.
          deliverable: "Code plus a research note."
          grading: both
        debate: "Does QE work mainly through portfolio balance or through signalling?"
      - id: E8
        title: "International Macro & the Dollar"
        tier: M
        hours: 120
        prereqs: [E5, S2]
        core: >-
          Balance of payments, UIP failure, CIP deviations, the trilemma,
          Mundell–Fleming, Dornbusch overshooting, the dominant-currency paradigm, the
          global financial cycle, safe assets and convenience yields.
        sources:
          - "Fama (1984), JME 14(3)"
          - "Dornbusch (1976), JPE 84(6)"
          - "Du, Tepper & Verdelhan (2018), JF 73(3)"
          - "Gopinath et al. (2020), AER 110(3)"
          - "Rey (2013), Jackson Hole Economic Policy Symposium"
          - "Miranda-Agrippino & Rey (2020), REStud 87(6)"
          - "Krishnamurthy & Vissing-Jorgensen (2012), JPE 120(2)"
          - "Jiang, Krishnamurthy & Lustig (2021), JF 76(3)"
          - "Obstfeld & Rogoff, Foundations of International Macroeconomics (1996)"
        lab: "Fama UIP regression on embedded FX and rate data."
        project:
          title: "CIP-basis monitor"
          brief: >-
            Compute cross-currency bases from public rates and FX data, relate them to
            quarter-ends and dollar-funding stress, and explain the mechanism.
          deliverable: "Monitor plus a mechanism memo."
          grading: both
        debate: "Is UIP failure a risk premium or mispricing?"
      - id: E9
        title: "Sovereign Debt, Crises & Political Economy"
        tier: M
        hours: 80
        prereqs: [E7, E8]
        core: >-
          Debt dynamics and r minus g, sovereign default, currency-crisis models,
          sudden stops, banking crises, the Reinhart–Rogoff replication episode.
        sources:
          - "Blanchard (2019), AER 109(4)"
          - "Eaton & Gersovitz (1981), REStud 48(2)"
          - "Krugman (1979), Journal of Money, Credit and Banking 11(3)"
          - "Obstfeld (1996), European Economic Review 40(3-5)"
          - "Calvo (1998), Journal of Applied Economics 1(1)"
          - "Reinhart & Rogoff, This Time Is Different (2009)"
          - "Herndon, Ash & Pollin (2014), Cambridge Journal of Economics 38(2)"
        lab: "Debt-dynamics simulator under stochastic r and g."
        project:
          title: "Sovereign risk report"
          brief: >-
            Build a debt-sustainability analysis for one country from public data, with
            fan charts and a default-probability mapping, and defend it in a two-page
            memo.
          deliverable: "Model plus memo."
          grading: both

  - order: 5
    code: FC
    title: "Finance Core"
    studio:
      id: STUDIO-FC
      tier: U
      requires: [FC1, FC2]
      title: "Market Structure Field Guide"
      hours: 30
      grading: rubric
      brief: >-
        For one asset class, produce a complete field guide covering venues,
        participants, instruments, order types, clearing and settlement, typical costs,
        and the three biggest structural risks, every claim sourced.
      deliverables: ["Field guide (in-page template)"]
    modules:
      - id: FC1
        title: "The Financial System, Markets & Instruments"
        tier: U
        hours: 70
        prereqs: [P0.1, E1]
        core: >-
          Money and credit creation, intermediaries, exchanges vs. OTC, instrument
          taxonomy across equities, rates, credit, FX, commodities and derivatives,
          order types, clearing and settlement.
        sources:
          - "Mishkin, The Economics of Money, Banking and Financial Markets, 13th ed. (2022)"
          - "Harris, Trading and Exchanges (2003)"
          - "McLeay, Radia & Thomas (2014), Bank of England Quarterly Bulletin Q1"
        lab: "Trace one trade from order entry to settlement."
        project:
          title: "Instrument cash-flow engine"
          brief: >-
            Represent bonds, futures, swaps and options as dated cash-flow or payoff
            objects with a common interface, and test each against hand-computed
            examples.
          deliverable: "Tested module."
          grading: autograder
      - id: FC2
        title: "Derivatives Fundamentals"
        tier: U
        hours: 90
        prereqs: [M4, CF1]
        core: >-
          Forwards, futures, swaps, option payoffs, no-arbitrage forward pricing,
          put–call parity, one-period and multi-period binomial pricing, using the
          Black–Scholes formula.
        sources:
          - "Hull, Options, Futures, and Other Derivatives, 11th ed. (2021)"
          - "Stoll (1969), JF 24(5)"
          - "Cox, Ross & Rubinstein (1979), JFE 7(3)"
        lab: "Binomial price converging to Black–Scholes."
        project:
          title: "Arbitrage scanner"
          brief: >-
            Given an embedded option-chain snapshot, detect put–call parity and
            convexity violations net of a stated cost model, and explain each one found.
          deliverable: "Scanner plus a findings note."
          grading: both
      - id: FC3
        title: "Market Efficiency: The Evidence Primer"
        tier: U
        hours: 45
        prereqs: [AP2]
        core: >-
          The efficient-markets hypothesis and its forms, the arithmetic of active
          management, luck vs. skill, the anomalies preview, behavioral explanations.
        sources:
          - "Fama (1970), JF 25(2)"
          - "Sharpe (1991), FAJ 47(1)"
          - "Fama & French (2010), JF 65(5)"
        lab: "Sharpe's arithmetic of active management, simulated."
        project:
          title: "Fund-skill test"
          brief: >-
            Using a simulated fund universe with known skill, show how many funds look
            skilled by chance, and recover the true skilled set with a bootstrap.
          deliverable: "Simulation plus memo."
          grading: both
        debate: "Are markets efficient? (primer; full debate in AP8 and CAP2)"
      - id: FC4
        title: "Investments & Equity Security Analysis"
        tier: U
        hours: 90
        prereqs: [AP2, AC2, CF1]
        core: >-
          Equity markets and instruments, industry and competitive analysis, the
          dividend discount model, FCFE and residual-income approaches, multiples,
          sell-side vs. buy-side research, and the evidence on analyst forecasts and
          recommendations.
        sources:
          - "Gordon & Shapiro (1956), Management Science 3(1)"
          - "Graham & Dodd, Security Analysis (1934)"
          - "Porter (1979), 'How Competitive Forces Shape Strategy', Harvard Business Review 57(2)"
          - "Womack (1996), JF 51(1)"
          - "Hong & Kubik (2003), JF 58(1)"
          - "Bodie, Kane & Marcus, Investments, latest ed. [V]"
        lab: "Gordon-growth sensitivity: value as (r − g) shrinks."
        project:
          title: "Initiation-of-coverage report"
          brief: >-
            Write a full sell-side-format initiation on a real public company: industry
            and competitive analysis, an Atlas-driven model (A15/A16), a price target
            with bull/base/bear scenarios and probabilities, key risks, and what would
            change the call.
          deliverable: "Initiation report plus model."
          grading: both

  - order: 6
    code: AC
    title: "Accounting & Financial Statement Analysis"
    studio:
      id: STUDIO-AC
      tier: U
      requires: [AC2]
      title: "Forensic Audit of a Public Company"
      hours: 50
      grading: rubric
      brief: >-
        Using SEC EDGAR filings and XBRL data for a real issuer over five or more years,
        produce a forensic report covering accrual quality, revenue-recognition
        changes, cash-conversion trends and M-score / F-score, with each red flag tied
        to the filing line it comes from.
      deliverables: ["Forensic report", "Reproducible extraction code"]
    modules:
      - id: AC1
        title: "Financial Accounting"
        tier: U
        hours: 120
        prereqs: [P0.1]
        core: >-
          Double-entry bookkeeping, accrual accounting, the three statements and how
          they link, GAAP vs. IFRS, revenue recognition (ASC 606 / IFRS 15), leases
          (ASC 842 / IFRS 16), stock compensation, deferred taxes.
        sources:
          - "FASB Accounting Standards Codification (primary)"
          - "IFRS Foundation, IFRS Standards (primary)"
        lab: "Build linked three statements from a transaction ledger."
        project:
          title: "Three-statement model from raw transactions"
          brief: >-
            Post 200 generated transactions, produce balance sheet, income statement and
            cash-flow statement, and prove the statements articulate.
          deliverable: "Tested model."
          grading: autograder
      - id: AC2
        title: "Financial Statement Analysis & Earnings Quality"
        tier: U
        hours: 110
        prereqs: [AC1, S0]
        core: >-
          Ratio analysis, DuPont decomposition, cash-flow quality, the accruals anomaly,
          earnings management, the F-score and M-score.
        sources:
          - "Penman, Financial Statement Analysis and Security Valuation, 5th ed. (2013)"
          - "Sloan (1996), The Accounting Review 71(3)"
          - "Dechow, Sloan & Sweeney (1995), The Accounting Review 70(2)"
          - "Piotroski (2000), Journal of Accounting Research 38 (Supplement)"
          - "Beneish (1999), FAJ 55(5)"
        lab: "DuPont decomposition from XBRL data."
        project:
          title: "Atlas A15: fundamentals engine"
          brief: >-
            Ingest EDGAR XBRL into Atlas, standardize the statements across filers, and
            implement the ratio, accrual and score library.
          deliverable: "Atlas at milestone A15."
          grading: autograder
          atlas: A15
      - id: AC3
        title: "Earnings, Disclosure & Market Reaction"
        tier: M
        hours: 60
        prereqs: [AC2, S6]
        core: >-
          Information content of earnings, post-earnings-announcement drift, disclosure
          and guidance, the residual-income link between accounting and value.
        sources:
          - "Ball & Brown (1968), Journal of Accounting Research 6(2)"
          - "Bernard & Thomas (1989), Journal of Accounting Research 27 (Supplement)"
          - "Ohlson (1995), Contemporary Accounting Research 11(2)"
        lab: "Earnings-surprise construction from XBRL."
        project:
          title: "PEAD replication"
          brief: >-
            Replicate post-earnings-announcement drift with the student's own price data
            (bring-your-own-data mode) and Atlas fundamentals. Report the post-2000
            decay and net-of-cost results.
          deliverable: "Replication plus a referee-style note."
          grading: both
      - id: AC4
        title: "Managerial & Cost Accounting for Decisions"
        tier: U
        hours: 70
        prereqs: [AC1]
        core: >-
          Cost behaviour, contribution margin and cost-volume-profit analysis, relevant
          costs for decisions, activity-based costing, master and flexible budgets,
          variance analysis, transfer pricing, performance measurement (residual income,
          EVA).
        sources:
          - "Datar & Rajan, Horngren's Cost Accounting, latest ed. [V]"
          - "Cooper & Kaplan (1988), 'Measure Costs Right: Make the Right Decisions', Harvard Business Review 66(5) [V]"
          - "Kaplan & Cooper, Cost & Effect (1998)"
        lab: "CVP break-even under mixed cost structures."
        project:
          title: "Budget and variance engine"
          brief: >-
            Build a master budget and a flexible budget for a seeded company case, and
            decompose actual-vs-budget profit into price, volume, mix and efficiency
            variances that reconcile exactly.
          deliverable: "Tested model plus management memo."
          grading: both

  - order: 7
    code: CF
    title: "Corporate Finance & Valuation"
    studio:
      id: STUDIO-CF
      tier: M
      requires: [CF4, CF5]
      title: "The Full Deal"
      hours: 80
      grading: rubric
      brief: >-
        For one public company: a full DCF and multiples valuation driven by Atlas A15
        and A16, an LBO model with a debt schedule and returns waterfall, a merger
        model with accretion/dilution and synergy sensitivity, and an
        investment-committee memo with a recommendation, defended against a hostile
        Q&A rubric.
      deliverables: ["Valuation", "LBO model", "Merger model", "IC memo"]
    modules:
      - id: CF1
        title: "Time Value & Capital Budgeting"
        tier: U
        hours: 60
        prereqs: [M1]
        core: >-
          NPV, IRR and its pitfalls, payback, project cash flows, inflation and real vs.
          nominal, what CFOs actually do.
        sources:
          - "Brealey, Myers & Allen, Principles of Corporate Finance, 14th ed. (2023)"
          - "Graham & Harvey (2001), JFE 60(2-3)"
        lab: "Multiple-IRR and NPV-vs-IRR ranking conflicts."
        project:
          title: "Capital-budgeting engine"
          brief: >-
            Build a project-evaluation tool with tax, depreciation, working capital and
            real-vs-nominal handling, plus Monte Carlo NPV.
          deliverable: "Tested module plus a case memo."
          grading: both
      - id: CF2
        title: "Cost of Capital & Capital Structure"
        tier: U
        hours: 80
        prereqs: [CF1, AP2]
        core: >-
          WACC and its estimation error, Modigliani–Miller, tax shields, trade-off vs.
          pecking order, market timing, leverage dynamics.
        sources:
          - "Modigliani & Miller (1958), AER 48(3)"
          - "Modigliani & Miller (1963), AER 53(3)"
          - "Myers (1984), JF 39(3)"
          - "Myers & Majluf (1984), JFE 13(2)"
          - "Fama & French (2002), RFS 15(1)"
          - "Baker & Wurgler (2002), JF 57(1)"
        lab: "MM with taxes and distress costs: the optimal-leverage curve."
        project:
          title: "Cost-of-capital estimation under uncertainty"
          brief: >-
            Estimate one firm's WACC with full error propagation (beta, ERP, spreads),
            and show the valuation range the error implies.
          deliverable: "Estimation code plus memo."
          grading: both
      - id: CF3
        title: "Payout, Governance & Agency"
        tier: U
        hours: 60
        prereqs: [CF2, E2]
        core: >-
          Dividends vs. buybacks, payout irrelevance and its failures, agency costs,
          free cash flow, boards, executive compensation, shareholder rights.
        sources:
          - "Lintner (1956), AER 46(2)"
          - "Miller & Modigliani (1961), Journal of Business 34(4)"
          - "Fama & French (2001), JFE 60(1)"
          - "Jensen & Meckling (1976), JFE 3(4)"
          - "Jensen (1986), AER 76(2)"
          - "Shleifer & Vishny (1997), JF 52(2)"
          - "Gompers, Ishii & Metrick (2003), QJE 118(1)"
          - "Bebchuk, Cohen & Ferrell (2009), RFS 22(2)"
        lab: "Lintner partial-adjustment model."
        project:
          title: "Governance scorecard"
          brief: >-
            Score ten firms on governance from proxy-statement data, and test (with
            honest power caveats) whether the score relates to valuation.
          deliverable: "Dataset, code, memo."
          grading: both
      - id: CF4
        title: "Valuation"
        tier: U
        hours: 100
        prereqs: [CF2, AC2]
        core: >-
          DCF (FCFF / FCFE), terminal value, multiples, residual income, sum of the
          parts, real options, and the valuation errors that dominate in practice.
        sources:
          - "Koller, Goedhart & Wessels, Valuation, 7th ed. (2020)"
          - "Damodaran, Investment Valuation, 3rd ed. (2012)"
          - "Ohlson (1995), Contemporary Accounting Research 11(2)"
          - "Dixit & Pindyck, Investment under Uncertainty (1994)"
        lab: "Terminal-value share of DCF value across growth assumptions."
        project:
          title: "Atlas A16: valuation engine"
          brief: >-
            Add DCF, residual-income and multiples valuation to Atlas, driven by A15
            fundamentals, with scenario and sensitivity grids.
          deliverable: "Atlas at milestone A16."
          grading: autograder
          atlas: A16
      - id: CF5
        title: "M&A, LBOs & Restructuring"
        tier: M
        hours: 80
        prereqs: [CF4]
        core: >-
          Takeover theory, announcement returns, synergies and overpayment, LBO
          mechanics and value creation, bankruptcy and Chapter 11.
        sources:
          - "Grossman & Hart (1980), Bell Journal of Economics 11(1)"
          - "Andrade, Mitchell & Stafford (2001), Journal of Economic Perspectives 15(2)"
          - "Moeller, Schlingemann & Stulz (2005), JF 60(2)"
          - "Kaplan & Strömberg (2009), Journal of Economic Perspectives 23(1)"
        lab: "LBO returns decomposition: leverage vs. multiple vs. operations."
        project:
          title: "LBO model"
          brief: >-
            Build a full LBO model (sources and uses, debt tranches, cash sweep,
            covenants, exit) with IRR/MOIC attribution, and test it for internal
            consistency.
          deliverable: "Tested model plus memo."
          grading: both
      - id: CF6
        title: "Raising Capital & Investment Banking"
        tier: M
        hours: 60
        prereqs: [CF3, S6]
        core: >-
          IPO underpricing, long-run IPO performance, SEOs, debt issuance,
          bookbuilding, underwriting economics.
        sources:
          - "Rock (1986), JFE 15(1-2)"
          - "Ritter (1991), JF 46(1)"
          - "Loughran & Ritter (1995), JF 50(1)"
          - "Ljungqvist (2007), 'IPO Underpricing', Handbook of Corporate Finance, Vol. 1"
        lab: "Winner's-curse underpricing model."
        project:
          title: "IPO pricing case"
          brief: >-
            Price a hypothetical IPO from comparables and DCF, design the book-building
            allocation, and explain the expected first-day return.
          deliverable: "Pricing model plus pitch memo."
          grading: rubric
      - id: CF7
        title: "Financial Modeling: Spreadsheets to Code"
        tier: U
        hours: 80
        prereqs: [AC1, CF1, CS1]
        core: >-
          Model architecture (inputs / calculations / outputs), integrated
          three-statement models, circularity (revolver interest), scenarios and
          sensitivities, error checks, the documented record of spreadsheet errors, and
          reconciling a spreadsheet model to an independent Python implementation.
        sources:
          - "Panko (1998), Journal of End User Computing 10(2)"
          - "Herndon, Ash & Pollin (2014), Cambridge Journal of Economics 38(2)"
          - "FAST Standard for financial modelling (practitioner) [V]"
        lab: "Revolver circularity: iteration vs. closed form."
        project:
          title: "Integrated three-statement + DCF model (.xlsx)"
          brief: >-
            Build an integrated three-statement model with a revolver, debt schedule and
            DCF in Excel, LibreOffice or Google Sheets for your seeded company case. The
            in-page grader (openpyxl in Pyodide) checks structure (no hard-codes in
            calculation blocks, balance check, cash tie-out) and the saved values against
            the Python reference.
          deliverable: "Workbook plus reconciliation report."
          grading: both
      - id: CF8
