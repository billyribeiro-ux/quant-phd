          banking book, the deposit franchise, capital and liquidity regulation (Basel
          III, LCR, NSFR).
        sources:
          - "Diamond (1984), REStud 51(3)"
          - "Drechsler, Savov & Schnabl (2017), QJE 132(4)"
          - "Drechsler, Savov & Schnabl (2021), JF 76(3)"
          - "Basel Committee on Banking Supervision, Basel III framework (primary)"
          - "Jiang, Matvos, Piskorski & Seru, 2023 bank fragility [V]"
        lab: "Economic value of equity under parallel and twist shocks."
        project:
          title: "ALM engine"
