parts:
  - order: 14
    code: F
    title: "Empirical Asset Pricing & Factors"
    studio:
      id: STUDIO-F
      tier: M
      requires: [F2, S7, QR2]
      title: "Factor Research Report"
      hours: 80
      grading: both
      brief: >-
        Propose an original signal, test it on open data (Open Source Asset Pricing
        plus French data) with the full Atlas integrity protocol (A7 + A8): spanning
        tests against the FF5 / q-factor models, multiple-testing haircut, net-of-cost
        returns, and subsample stability. Submit with a hostile referee report written
        on your own paper.
      deliverables: ["Research paper", "Replication package", "Self-referee report"]
    modules:
      - id: F1
        title: "Data & Methodology"
        tier: M
        hours: 60
        prereqs: [S2, AP2, QR1, S5]
        core: >-
          CRSP / Compustat structure (described), point-in-time discipline,
          survivorship and delisting bias, portfolio sorts, breakpoints and
          microcaps.
        introduces:
          crsp-compustat-structure: "CRSP and Compustat data structure"
          survivorship-bias: "Survivorship bias"
          delisting-bias: "Delisting bias and delisting returns"
          portfolio-sort: "Portfolio sort"
          nyse-breakpoints: "NYSE breakpoints"
          microcap-problem: "The microcap problem"
          portfolio-weighting-scheme: "Value-weighted vs. equal-weighted portfolios"
        sources:
          - "Shumway (1997), JF 52(1)"
          - "Kenneth R. French Data Library (primary)"
          - "Chen & Zimmermann (2022), Critical Finance Review 11(2)"
        lab: "Sorts on French data; delisting-bias demo (SIMULATED)."
        project:
          title: "Atlas A7: cross-sectional engine"
          brief: >-
            Add portfolio sorts, Fama–MacBeth with Shanken correction and the GRS
            test to Atlas.
          deliverable: "Atlas at milestone A7."
          grading: autograder
          atlas: A7
      - id: F2
        title: "The Classic Factors"
        tier: M
        hours: 90
        prereqs: [F1]
        core: "Size, value, momentum, profitability, investment, low risk, quality, and the factor models built from them."
        introduces:
          size-effect: "Size effect"
          value-premium: "Value premium (HML)"
          cross-sectional-momentum: "Cross-sectional momentum"
          profitability-factor: "Profitability factor"
          investment-factor: "Investment factor"
          betting-against-beta: "Low-risk anomaly and betting against beta"
          idiosyncratic-volatility-puzzle: "Idiosyncratic-volatility puzzle"
          quality-minus-junk: "Quality minus junk"
          fama-french-three-factor-model: "Fama–French three-factor model"
          carhart-four-factor-model: "Carhart four-factor model"
          fama-french-five-factor-model: "Fama–French five-factor model"
          q-factor-model: "q-factor model"
          spanning-regression: "Spanning regression"
          max-sharpe-model-comparison: "Comparing factor models by maximum squared Sharpe ratio"
        sources:
          - "Banz (1981), JFE 9(1)"
          - "Fama & French (1993), JFE 33(1)"
          - "Jegadeesh & Titman (1993), JF 48(1)"
          - "Carhart (1997), JF 52(1)"
          - "Novy-Marx (2013), JFE 108(1)"
          - "Fama & French (2015), JFE 116(1)"
          - "Hou, Xue & Zhang (2015), RFS 28(3)"
          - "Frazzini & Pedersen (2014), JFE 111(1)"
          - "Ang, Hodrick, Xing & Zhang (2006), JF 61(1)"
          - "Asness, Frazzini & Pedersen (2019), Review of Accounting Studies 24(1)"
        lab: "Factor statistics and spanning regressions."
        project:
          title: "Factor-model horse race"
          brief: >-
            Compare CAPM, FF3, Carhart, FF5 and q-factor models on the same test
            assets with GRS, the max-Sharpe metric and out-of-sample performance.
          deliverable: "Code plus report."
          grading: both
      - id: F3
        title: "Factors Across Asset Classes"
        tier: M
        hours: 70
        prereqs: [F2]
        core: "Value and momentum everywhere, carry, time-series momentum, the long-history evidence and its critics."
        introduces:
          value-and-momentum-everywhere: "Value and momentum across asset classes"
          carry-factor: "Carry as a cross-asset factor"
          time-series-momentum: "Time-series momentum"
          trend-following-long-history: "Long-history evidence on trend following"
          tsmom-pooled-regression-critique: "Pooled-regression critique of time-series momentum"
        sources:
          - "Asness, Moskowitz & Pedersen (2013), JF 68(3)"
          - "Koijen, Moskowitz, Pedersen & Vrugt (2018), JFE 127(2)"
          - "Moskowitz, Ooi & Pedersen (2012), JFE 104(2)"
          - "Hurst, Ooi & Pedersen (2017), JPM 44(1)"
          - "Huang, Li, Wang & Zhou (2020), JFE 135(3)"
        lab: "TSMOM vs. its pooled-regression critique."
        project:
          title: "Multi-asset factor book"
          brief: >-
            Build carry, momentum and value across rates, FX and commodity proxies from
            open data, and report correlations, crash behaviour and diversification.
          deliverable: "Code plus report."
          grading: both
        debate: "Is time-series momentum real after 2009?"
      - id: F4
        title: "Crashes, Crowding & Decay"
        tier: M
        hours: 50
        prereqs: [F3]
        core: "Momentum crashes, the 2007 quant quake, post-publication decay, value's long drawdown."
        introduces:
          momentum-crash: "Momentum crash"
          quant-quake-2007: "The August 2007 quant quake"
          factor-crowding: "Factor crowding"
          post-publication-decay: "Post-publication decay of anomaly returns"
          value-drawdown: "Value's long drawdown"
          dynamic-momentum: "Dynamic (crash-managed) momentum"
        sources:
          - "Daniel & Moskowitz (2016), JFE 122(2)"
          - "Khandani & Lo (2011), Journal of Financial Markets 14(1)"
          - "McLean & Pontiff (2016), JF 71(1)"
        lab: "Crash-conditional momentum."
        project:
          title: "Crash-risk overlay"
          brief: >-
            Implement a dynamic momentum strategy, and test whether it survives
            out of sample, net of costs, and against a simple vol-scaled
            benchmark.
          deliverable: "Code plus verdict memo."
          grading: both
        debate: "Is value dead?"
      - id: F5
        title: "The Factor Zoo & Replication"
        tier: D
        hours: 80
        prereqs: [F2, S5, S7]
        core: "Multiple testing in the cross-section, replication studies and their disagreement, factor selection."
        introduces:
          factor-zoo: "The factor zoo"
          publication-bias: "Publication bias"
          anomaly-replication-rate: "Anomaly replication rate and its definition"
          replication-methodology-choices: "Methodological choices that drive replication outcomes"
          bayesian-replication-shrinkage: "Hierarchical Bayesian shrinkage of factor alphas"
          double-selection-factor-test: "Double-selection test for new factors"
        sources:
          - "Harvey, Liu & Zhu (2016), RFS 29(1)"
          - "Hou, Xue & Zhang (2020), 'Replicating Anomalies', RFS 33(5)"
          - "Jensen, Kelly & Pedersen (2023), JF 78(5)"
          - "Chen & Zimmermann (2022), Critical Finance Review 11(2)"
          - "Feng, Giglio & Xiu (2020), JF 75(3)"
        lab: "Multiple-testing haircut on the open anomaly set."
        project:
          title: "Replication-crisis adjudication"
          brief: >-
            Using the open anomaly dataset, reproduce the key disagreement between
            HXZ-style and JKP-style replication conclusions, and identify exactly which
            methodological choices drive it.
          deliverable: "Research note plus code."
          grading: both
        debate: "Are most published factors false discoveries?"
      - id: F6
        title: "Machine Learning in Asset Pricing"
        tier: D
        hours: 100
        prereqs: [F5, QR3]
        core: >-
          ML return prediction, latent-factor models (IPCA), deep SDFs, the complexity
          debate.
        introduces:
          ml-return-prediction: "Machine-learning return prediction in the cross-section"
          ipca: "Instrumented principal component analysis (IPCA)"
          deep-sdf: "Deep-learning SDF estimation"
          virtue-of-complexity: "The virtue-of-complexity claim"
        sources:
          - "Gu, Kelly & Xiu (2020), RFS 33(5)"
          - "Kelly, Pruitt & Su (2019), JFE 134(3)"
          - "Chen, Pelger & Zhu (2024), Management Science 70(2)"
          - "Kelly, Malamud & Zhou (2024), JF 79(1)"
          - "Nagel (2025), 'Seemingly Virtuous Complexity in Return Prediction', NBER Working Paper 34104 [WP]"
          - "Kelly & Xiu (2023), Foundations and Trends in Finance 13(3-4)"
        lab: "Ridge vs. OLS out-of-sample R-squared."
        project:
          title: "ML cross-section study"
          brief: >-
            Train linear, tree and neural predictors on the open anomaly set via Atlas
            A17 with purged CV, report OOS R-squared and long–short Sharpe net of cost,
            and test the complexity claim.
          deliverable: "Paper-format study plus code."
          grading: both
        debate: "Does complexity help return prediction?"
      - id: F7
        title: "Performance Evaluation & Skill"
        tier: M
        hours: 60
        prereqs: [F2, S3]
        core: >-
          Alpha and its standard errors, Sharpe-ratio statistics, return smoothing,
          nonlinear payoffs, manager evaluation.
        introduces:
          alpha-inference: "Alpha and its standard error"
          autocorrelation-adjusted-sharpe-ratio: "Serial-correlation-adjusted Sharpe ratio"
          return-smoothing: "Return smoothing"
          return-unsmoothing: "Unsmoothing a reported return series"
          nonlinear-payoff-exposure: "Option-like (nonlinear) payoff exposure"
          factor-adjusted-alpha: "Factor-adjusted alpha"
          manager-due-diligence: "Manager due diligence"
        sources:
          - "Jensen (1968), JF 23(2)"
          - "Lo (2002), FAJ 58(4)"
          - "Getmansky, Lo & Makarov (2004), JFE 74(3)"
          - "Fung & Hsieh (2001), RFS 14(2)"
        lab: "Sharpe confidence interval under autocorrelation."
        project:
          title: "Manager due-diligence tool"
          brief: >-
            Evaluate a set of return streams (some smoothed, some option-like) for true
            risk, unsmoothed Sharpe and factor-adjusted alpha, and rank them honestly.
          deliverable: "Tool plus memo."
          grading: both

  - order: 15
    code: PR
    title: "Portfolio Construction & Risk"
    studio:
      id: STUDIO-PR
      tier: M
      requires: [PR2, PR4]
      title: "Multi-Asset Portfolio with Risk Engine"
      hours: 60
      grading: both
      brief: >-
        Run a multi-asset portfolio through Atlas A11 / A12 across a historical window:
        allocation policy, vol targeting, drawdown policy, VaR / ES backtests and stress
        scenarios. Write an investment-policy statement the results actually justify.
      deliverables: ["Portfolio run", "Risk report", "Investment-policy statement"]
    modules:
      - id: PR1
        title: "Mean-Variance in Practice"
        tier: M
        hours: 70
        prereqs: [AP2, S2]
        core: "Estimation error, 1/N, shrinkage, Black–Litterman, robust optimization."
        introduces:
          mean-variance-estimation-error: "Estimation error in mean-variance inputs"
          error-maximization: "Optimizer error maximization"
          equal-weight-portfolio: "The 1/N portfolio benchmark"
          covariance-shrinkage: "Covariance shrinkage"
          black-litterman-model: "Black–Litterman model"
          robust-portfolio-optimization: "Robust portfolio optimization"
        sources:
          - "Michaud (1989), FAJ 45(1)"
          - "Chopra & Ziemba (1993), JPM 19(2)"
          - "DeMiguel, Garlappi & Uppal (2009), 'Optimal Versus Naive Diversification: How Inefficient is the 1/N Portfolio Strategy?', RFS 22(5)"
          - "Ledoit & Wolf (2004), Journal of Multivariate Analysis 88(2)"
          - "Ledoit & Wolf (2017), RFS 30(12)"
          - "Black & Litterman (1992), FAJ 48(5)"
        lab: "Optimizer instability under resampling."
        project:
          title: "Allocator shoot-out"
          brief: >-
            Compare sample MV, shrinkage MV, Black–Litterman, minimum variance and 1/N
            out of sample with turnover costs, and explain the ranking.
          deliverable: "Code plus report."
          grading: both
      - id: PR2
        title: "Risk Parity, Vol Targeting & Leverage"
        tier: M
        hours: 60
        prereqs: [PR1]
        core: "Risk budgeting, leverage aversion, volatility-managed portfolios and the critique, vol-targeting evidence."
        introduces:
          risk-budgeting: "Risk budgeting"
          risk-parity: "Risk parity (equal risk contribution)"
          leverage-aversion: "Leverage aversion"
          volatility-targeting: "Volatility targeting"
          volatility-managed-portfolio: "Volatility-managed portfolio"
          vol-managed-critique: "Out-of-sample critique of volatility management"
        sources:
          - "Asness, Frazzini & Pedersen (2012), FAJ 68(1)"
          - "Moreira & Muir (2017), JF 72(4)"
          - "Cederburg, O'Doherty, Wang & Yan (2020), JFE 138(1)"
          - "Harvey, Hoyle, Korgaonkar, Rattray, Sargaison & Van Hemert (2018), JPM 45(1)"
        lab: "Vol-managed factor returns, in and out of sample."
        project:
          title: "Atlas A11: portfolio construction"
          brief: >-
            Add shrinkage covariance and MV / risk-parity / vol-target allocators with
            constraint handling to Atlas.
          deliverable: "Atlas at milestone A11."
          grading: autograder
          atlas: A11
        debate: "Are vol-managed portfolios a free lunch?"
      - id: PR3
        title: "Growth-Optimal Sizing"
        tier: M
        hours: 50
        prereqs: [PR1, SC6]
        core: "The Kelly criterion, fractional Kelly, parameter uncertainty, Samuelson's critique, sizing in practice."
        introduces:
          kelly-criterion: "Kelly criterion"
          growth-optimal-portfolio: "Growth-optimal portfolio"
          fractional-kelly: "Fractional Kelly"
          kelly-estimation-error: "Kelly sizing under estimation error"
          samuelson-kelly-critique: "Samuelson's critique of growth-optimal investing"
        sources:
          - "Kelly (1956), Bell System Technical Journal 35(4)"
          - "Breiman (1961), Proceedings of the Fourth Berkeley Symposium, Vol. 1"
          - "Samuelson (1979), Journal of Banking & Finance 3(4)"
          - "MacLean, Thorp & Ziemba (eds.), The Kelly Capital Growth Investment Criterion (2011)"
        lab: "Kelly under estimation error."
        project:
          title: "Sizing policy under uncertainty"
          brief: >-
            Derive and simulate the optimal Kelly fraction when the edge is estimated
            with error, and produce a sizing rule a PM could actually follow.
          deliverable: "Derivation, simulation, policy memo."
          grading: both
      - id: PR4
        title: "Risk Measurement"
        tier: M
        hours: 100
        prereqs: [PR1, S4]
        core: >-
          VaR and expected shortfall, coherence, VaR backtests, extreme value theory,
          copulas and tail dependence, stress testing, FRTB.
        introduces:
          value-at-risk: "Value at risk"
          expected-shortfall: "Expected shortfall"
          coherent-risk-measure: "Coherent risk measure"
          kupiec-test: "Kupiec unconditional-coverage test"
          christoffersen-test: "Christoffersen independence test"
          extreme-value-theory: "Extreme value theory (peaks over threshold)"
          copula: "Copula"
          tail-dependence: "Tail dependence"
          stress-testing: "Stress testing and scenario analysis"
          frtb: "Fundamental Review of the Trading Book"
        sources:
          - "Artzner, Delbaen, Eber & Heath (1999), Mathematical Finance 9(3)"
          - "Kupiec (1995), Journal of Derivatives 3(2)"
          - "Christoffersen (1998), International Economic Review 39(4)"
          - "McNeil & Frey (2000), Journal of Empirical Finance 7(3-4)"
          - "McNeil, Frey & Embrechts, Quantitative Risk Management, revised ed. (2015)"
        lab: "VaR backtest: Kupiec and Christoffersen tests."
        project:
          title: "Atlas A12: risk engine"
          brief: >-
            Add historical, parametric and EVT VaR / ES, VaR backtests, and a scenario
            and stress engine to Atlas.
          deliverable: "Atlas at milestone A12."
          grading: autograder
          atlas: A12
      - id: PR5
        title: "Drawdowns & Capital Allocation"
        tier: M
        hours: 40
        prereqs: [PR3]
        core: "Drawdown distributions, drawdown-constrained investing, risk of ruin, multi-strategy capital allocation."
        introduces:
          maximum-drawdown: "Maximum drawdown"
          drawdown-distribution: "Drawdown distribution"
          drawdown-constrained-investing: "Drawdown-constrained investing"
          risk-of-ruin: "Risk of ruin"
          multi-strategy-allocation: "Multi-strategy capital allocation"
          drawdown-stop-rule: "Drawdown stop-loss rule"
        sources:
          - "Magdon-Ismail, Atiya, Pratap & Abu-Mostafa (2004), Journal of Applied Probability 41(1)"
          - "Grossman & Zhou (1993), Mathematical Finance 3(3)"
        lab: "Drawdown distribution vs. Sharpe ratio."
        project:
          title: "Pod allocation simulator"
          brief: >-
            Simulate a multi-manager platform with drawdown stops, and find the
            stop-loss and allocation rules that maximize platform Sharpe without
            killing skilled managers.
          deliverable: "Simulator plus memo."
          grading: both
      - id: PR6
        title: "Dynamic & Long-Horizon Allocation"
        tier: D
        hours: 80
        prereqs: [SC6, PR1]
        core: "Intertemporal hedging demands, return predictability and horizon, liability-driven investing, time diversification."
        introduces:
          intertemporal-hedging-demand: "Intertemporal hedging demand"
          horizon-effect: "Investment-horizon effects under return predictability"
          time-diversification: "Time diversification and its fallacy"
          lifecycle-allocation: "Lifecycle allocation with labour income"
          target-date-glide-path: "Target-date glide path"
        sources:
          - "Campbell & Viceira, Strategic Asset Allocation (2002)"
          - "Merton (1971), JET 3(4)"
        lab: "Horizon effects under mean reversion."
        project:
          title: "Lifecycle allocation model"
          brief: >-
            Solve a lifecycle allocation with labour income and return predictability
            numerically, and compare it with target-date glide paths.
          deliverable: "Solver plus report."
          grading: both

  - order: 16
    code: MS
    title: "Market Microstructure & Execution"
    studio:
      id: STUDIO-MS
      tier: M
      requires: [MS2, MS3]
      title: "Execution Desk"
      hours: 60
      grading: both
      brief: >-
        Extend the CS studio matching engine into an agent-based market (market
        makers, informed traders, noise traders). Calibrate impact, implement and
        compare execution algorithms (TWAP, VWAP, Almgren–Chriss, adaptive), and
        report implementation shortfall.
      deliverables: ["Agent-based market", "Execution algorithms", "TCA report"]
    modules:
      - id: MS1
        title: "Microstructure Theory"
        tier: M
        hours: 90
        prereqs: [E4, S1]
        core: >-
          Roll's spread estimator, Kyle, Glosten–Milgrom, inventory models, PIN, the
          VPIN dispute.
        introduces:
          roll-spread-estimator: "Roll's spread estimator"
          kyle-model: "Kyle model"
          kyles-lambda: "Kyle's lambda"
          glosten-milgrom-model: "Glosten–Milgrom model"
          inventory-model: "Inventory models of market making"
          spread-decomposition: "Bid–ask spread decomposition"
          probability-of-informed-trading: "Probability of informed trading (PIN)"
          vpin: "VPIN and its dispute"
        sources:
          - "Roll (1984), JF 39(4)"
          - "Kyle (1985), Econometrica 53(6)"
          - "Glosten & Milgrom (1985), JFE 14(1)"
          - "Ho & Stoll (1981), JFE 9(1)"
          - "Easley, Kiefer, O'Hara & Paperman (1996), JF 51(4)"
          - "Easley, López de Prado & O'Hara (2012), RFS 25(5)"
          - "Andersen & Bondarenko (2014), 'VPIN and the Flash Crash', Journal of Financial Markets 17"
        lab: "Kyle equilibrium."
        project:
          title: "Spread decomposition"
          brief: >-
            Implement Roll and Glosten–Milgrom-style decompositions on simulated and
            bring-your-own-data trades, and separate adverse selection from inventory
            and order-processing costs.
          deliverable: "Code plus note."
          grading: both
      - id: MS2
        title: "Limit Order Books & Market Structure"
        tier: M
        hours: 60
        prereqs: [MS1, CS2]
        core: >-
          LOB dynamics, Reg NMS, dark pools, payment for order flow, HFT evidence, the
          2010 Flash Crash, frequent batch auctions.
        introduces:
          queue-position: "Queue position in the order book"
          lob-dynamics: "Limit-order-book dynamics"
          reg-nms: "Regulation NMS"
          dark-pool: "Dark pool"
          payment-for-order-flow: "Payment for order flow"
          high-frequency-trading: "High-frequency trading"
          latency-arbitrage: "Latency arbitrage"
          flash-crash-2010: "The May 2010 Flash Crash"
          frequent-batch-auction: "Frequent batch auction"
        sources:
          - "Cont, Stoikov & Talreja (2010), Operations Research 58(3)"
          - "Brogaard, Hendershott & Riordan (2014), RFS 27(8)"
          - "Kirilenko, Kyle, Samadi & Tuzun (2017), JF 72(3)"
          - "Budish, Cramton & Shim (2015), QJE 130(4)"
        lab: "Queue-position simulator."
        project:
          title: "Batch-auction counterfactual"
          brief: >-
            Run the same order flow through continuous trading and frequent batch
            auctions in the studio engine, and measure the latency-arbitrage rents.
          deliverable: "Simulation plus memo."
          grading: both
        debate: "Does HFT improve market quality?"
      - id: MS3
        title: "Market Impact & Optimal Execution"
        tier: M
        hours: 80
        prereqs: [MS1, SC6]
        core: "The square-root law, propagator models, Almgren–Chriss, Obizhaeva–Wang."
        introduces:
          square-root-impact-law: "Square-root law of market impact"
          propagator-model: "Propagator model of impact"
          almgren-chriss-model: "Almgren–Chriss optimal execution"
          efficient-execution-frontier: "Efficient frontier of execution strategies"
          obizhaeva-wang-model: "Obizhaeva–Wang model"
          implementation-shortfall: "Implementation shortfall"
        sources:
          - "Almgren, Thum, Hauptmann & Li (2005), Risk"
          - "Tóth et al. (2011), Physical Review X 1"
          - "Almgren & Chriss (2001), Journal of Risk 3(2)"
          - "Obizhaeva & Wang (2013), Journal of Financial Markets 16(1)"
          - "Bouchaud, Bonart, Donier & Gould, Trades, Quotes and Prices (2018)"
        lab: "Almgren–Chriss efficient frontier."
        project:
          title: "Atlas A10: execution and cost models"
          brief: >-
            Add square-root impact, the Almgren–Chriss scheduler and
            implementation-shortfall accounting to Atlas.
          deliverable: "Atlas at milestone A10."
          grading: autograder
          atlas: A10
      - id: MS4
        title: "Costs, Capacity & Implementation Shortfall"
        tier: M
        hours: 50
        prereqs: [MS3, F2]
        core: "Implementation shortfall, anomaly returns net of cost, strategy capacity."
        introduces:
          anomaly-net-of-cost: "Anomaly returns net of trading costs"
          strategy-capacity: "Strategy capacity"
          cost-mitigation: "Trading-cost mitigation (buy–hold spreads, netting)"
        sources:
          - "Perold (1988), JPM 14(3)"
          - "Novy-Marx & Velikov (2016), RFS 29(1)"
          - "Patton & Weller (2020), JFE 137(2)"
          - "Frazzini, Israel & Moskowitz (2018), 'Trading Costs', SSRN Working Paper 3229719 [WP]"
        lab: "Anomaly returns net of cost."
        project:
          title: "Capacity study"
          brief: >-
            Estimate the capacity of a factor strategy under the square-root impact
            model, and find the AUM at which net alpha hits zero.
          deliverable: "Code plus memo."
          grading: both

  - order: 17
    code: QR
    title: "Quantitative Research Engineering"
    studio:
      id: STUDIO-QR
      tier: M
      requires: [QR2, QR3, MS3, PR4]
      title: "End-to-End Systematic Strategy"
      hours: 80
      grading: both
      brief: >-
        Take one strategy from hypothesis to paper-trading spec, entirely on Atlas:
        data (A2), features, model (A17), backtest (A9), costs (A10), integrity (A8),
        risk (A12). Pre-register the hypothesis and protocol before touching
        out-of-sample data. The grade rewards honesty about failure as much as
        success.
      deliverables: ["Pre-registration", "Research report", "Paper-trading specification"]
    modules:
      - id: QR1
        title: "Research Data Engineering"
        tier: M
        hours: 60
        prereqs: [CS3, CS4, S0]
        core: >-
          Point-in-time databases, corporate actions, tick data, timestamps and time
          zones, data vintages, alternative-data due diligence.
        introduces:
          look-ahead-bias: "Look-ahead bias"
          data-vintage: "Data vintage (real-time dataset)"
          bitemporal-data-model: "Bitemporal data model"
          timestamp-semantics: "Timestamp semantics and time zones"
          corporate-action-adjustment-factor: "Corporate-action adjustment factors"
          tick-data: "Tick data (trades and quotes)"
          alternative-data-due-diligence: "Alternative-data due diligence"
        sources:
          - "Croushore & Stark (2001), Journal of Econometrics 105(1)"
          - "ALFRED real-time database, Federal Reserve Bank of St. Louis (primary)"
        lab: "DuckDB ASOF JOIN point-in-time merge."
        project:
          title: "Vintage-aware ingestion"
          brief: >-
