# Third-party runtime the course site vendors. Nothing loads from a CDN at run
# time (BLUEPRINT §6): `tools/fetch_vendor.py --relock` resolves this spec into
# course/assets/vendor/LOCK.json (every file with its URL, SHA-256, size and
# licence), and `tools/fetch_vendor.py` downloads and verifies exactly those
# files. Vendored files are never committed; LOCK.json is.
#
# Versions are pinned exactly and were at least two weeks old when locked.
npm:
  - package: katex
    version: "0.19.1"
    license: MIT
    dest: katex
    strip: dist/
    files: [dist/katex.min.js, dist/katex.min.css, dist/contrib/auto-render.min.js, "dist/fonts/*.woff2", LICENSE]
  - package: d3
    version: "7.9.0"
    license: ISC
    dest: d3
    strip: dist/
    files: [dist/d3.min.js, LICENSE]
  - package: "@fontsource-variable/source-serif-4"
    version: "5.3.1"
    license: OFL-1.1
    dest: fonts/source-serif-4
    strip: files/
    files:
      - files/source-serif-4-latin-wght-normal.woff2
      - files/source-serif-4-latin-wght-italic.woff2
      - files/source-serif-4-latin-ext-wght-normal.woff2
      - files/source-serif-4-latin-ext-wght-italic.woff2
      - LICENSE
  - package: "@fontsource-variable/inter"
    version: "5.3.0"
    license: OFL-1.1
    dest: fonts/inter
    strip: files/
    files:
      - files/inter-latin-wght-normal.woff2
      - files/inter-latin-ext-wght-normal.woff2
      - LICENSE
  - package: "@fontsource-variable/jetbrains-mono"
    version: "5.3.0"
    license: OFL-1.1
    dest: fonts/jetbrains-mono
    strip: files/
    files:
      - files/jetbrains-mono-latin-wght-normal.woff2
      - files/jetbrains-mono-latin-ext-wght-normal.woff2
      - LICENSE

# Pyodide runs every lab and autograder in the browser. Its pytest is the same
# version as the local pin in requirements-dev.txt, so one suite runs in both.
pyodide:
  version: "314.0.7"
  license: MPL-2.0
  dest: pyodide
  core: [pyodide.mjs, pyodide.asm.mjs, pyodide.asm.wasm, python_stdlib.zip, pyodide-lock.json]
  # Requested packages; their dependency closure is taken from pyodide-lock.json.
  packages: [numpy, scipy, pytest]
