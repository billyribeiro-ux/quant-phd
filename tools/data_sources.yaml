# Embedded market data (tools/fetch_data.py). Every dataset quotes the issuer's own statement that it may be
# copied and distributed, with the URL that states it. A source whose terms grant no such permission, or could
# not be read, is never embedded: it goes under `rejected`, with what was found and when.
#
# Each dataset is read from the Board's own release page, which carries the full release as a zip of SDMX XML:
# H.10 at https://www.federalreserve.gov/releases/h10/default.htm and H.15 at
# https://www.federalreserve.gov/releases/h15/default.htm.
# The Data Download Program is being retired. The Board plans to remove its "Build Your Package" option the week of
# 2026-11-09, and says "Historical data will remain available for download as XML files on statistical release pages"
# (https://www.federalreserve.gov/data/data-download-fred-information.htm, last updated 2026-07-16). The snapshots
# were first built on 2026-10-17 from Data Download Program files (H.10 zip SHA-256 c5b43095..., H.15 ab8cbf17...;
# see this file's history). MANIFEST records the H.10 release-page zip retrieved on 2026-10-19 (Last-Modified
# 2026-10-19 20:15 GMT; SHA-256 8f370f9c...) and the H.15 zip retrieved on 2026-10-20 (SHA-256 334a7f88...; the
# 2026-10-19 H.15 zip, 8a0c7ec4..., was replaced upstream). Both rebuild the same snapshots byte for byte. A
# refetch of new bytes records them with that day's date; the weekly live-data job checks the snapshots.
# The snapshots below are committed and pinned by SHA-256, so labs keep working whatever happens to any URL.

datasets:
  - id: fx_daily
    title: Daily foreign exchange rates, six major currencies, USD per unit of foreign currency
    issuer: Board of Governors of the Federal Reserve System
    url: https://www.federalreserve.gov/releases/h10/data/FRB_h10_xml.zip
    licence: >-
      "Unless otherwise indicated, information on Board's website is in the public domain and may be copied and
      distributed without permission. Please cite to the Board as the source of the information."
    licence_url: https://www.federalreserve.gov/disclaimer.htm
    citation: Board of Governors of the Federal Reserve System, G.5/H.10 Foreign Exchange Rates (noon buying rates in New York)
    note: >-
      Spot rates only: a currency position's return also earns the interest differential, which these series
      do not contain. Dates are New York business days; a holiday has no row.
      The H.10 release describes its data as "noon buying rates in New York for cable transfers payable in the
      listed currencies" and says "The rates have been certified by the Federal Reserve Bank of New York for
      customs purposes ... as required by section 522 of the amended Tariff Act of 1930"
      (https://www.federalreserve.gov/releases/h10/about.htm). The Board publishes the certified rates as its own
      release on its website, and about.htm indicates no other terms, so the Board's default grant quoted in
      licence applies ("Unless otherwise indicated ... public domain"). about.htm checked 2026-10-23; the current
      release page's per-currency footnotes could not be re-read from this environment that day.
    transform:
      kind: fed_sdmx
      member: H10_data.xml
      sample: daily
      start: "2000-01-03"
      end: "2026-09-30"
      series:
        AUD: RXI$US_N.B.AL
        CAD: RXI_N.B.CA
        CHF: RXI_N.B.SZ
        EUR: RXI$US_N.B.EU
        GBP: RXI$US_N.B.UK
        JPY: RXI_N.B.JA
      invert: [CAD, CHF, JPY]

  - id: fx_monthly
    title: Month-end foreign exchange rates, ten currencies, USD per unit of foreign currency
    issuer: Board of Governors of the Federal Reserve System
    url: https://www.federalreserve.gov/releases/h10/data/FRB_h10_xml.zip
    licence: >-
      "Unless otherwise indicated, information on Board's website is in the public domain and may be copied and
      distributed without permission. Please cite to the Board as the source of the information."
    licence_url: https://www.federalreserve.gov/disclaimer.htm
    citation: Board of Governors of the Federal Reserve System, G.5/H.10 Foreign Exchange Rates (noon buying rates in New York)
    note: >-
      Each value is the last noon rate of its month, sampled from the daily series (the release's own monthly
      series are monthly averages). The euro starts in January 1999. Spot rates only, as for fx_daily.
      The H.10 release describes its data as "noon buying rates in New York for cable transfers payable in the
      listed currencies" and says "The rates have been certified by the Federal Reserve Bank of New York for
      customs purposes ... as required by section 522 of the amended Tariff Act of 1930"
      (https://www.federalreserve.gov/releases/h10/about.htm). The Board publishes the certified rates as its own
      release on its website, and about.htm indicates no other terms, so the Board's default grant quoted in
      licence applies ("Unless otherwise indicated ... public domain"). about.htm checked 2026-10-23; the current
      release page's per-currency footnotes could not be re-read from this environment that day.
    transform:
      kind: fed_sdmx
      member: H10_data.xml
      sample: month_end
      start: "1971-01-01"
      end: "2026-09-30"
      series:
        AUD: RXI$US_N.B.AL
        CAD: RXI_N.B.CA
        CHF: RXI_N.B.SZ
        DKK: RXI_N.B.DN
        EUR: RXI$US_N.B.EU
        GBP: RXI$US_N.B.UK
        JPY: RXI_N.B.JA
        NOK: RXI_N.B.NO
        NZD: RXI$US_N.B.NZ
        SEK: RXI_N.B.SD
      invert: [CAD, CHF, DKK, JPY, NOK, SEK]

  - id: ust_daily
    title: Daily 3-month Treasury bill and 10-year Treasury constant-maturity yields, percent per year
    issuer: Board of Governors of the Federal Reserve System
    url: https://www.federalreserve.gov/releases/h15/data/FRB_h15_xml.zip
    licence: >-
      "Unless otherwise indicated, information on Board's website is in the public domain and may be copied and
      distributed without permission. Please cite to the Board as the source of the information."
    licence_url: https://www.federalreserve.gov/disclaimer.htm
    citation: Board of Governors of the Federal Reserve System, H.15 Selected Interest Rates
    note: >-
      tbill_3m is the 3-month bill's secondary-market rate on a discount basis; cmt_10y is the 10-year
      constant-maturity yield. Both are as published, in percent per year. Of the two series embedded here, only
      the constant maturity names a non-Board source ("Source: U.S. Treasury", H.15 footnote 9,
      https://www.federalreserve.gov/releases/h15/default.htm). A U.S. Treasury series is a work of the United
      States Government: "Copyright protection under this title is not available for any work of the United
      States Government" (17 U.S.C. 105(a), https://www.copyright.gov/title17/92chap1.html). Checked 2026-10-17
      and again 2026-10-19.
    transform:
      kind: fed_sdmx
      member: H15_data.xml
      sample: daily
      start: "2000-01-03"
      end: "2026-09-30"
      series:
        tbill_3m: RIFSGFSM03_N.B
        cmt_10y: RIFLGFCY10_N.B

# Checked and not embedded. Re-check before relying on any of these.
rejected:
  - name: Kenneth R. French Data Library
    url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html
    checked: "2026-10-18"
    finding: >-
      The library page, the industry-portfolio description page (Data_Library/det_10_ind_port.html) and the
      home page carry only a copyright line, rendered "Copyright <current year> Eugene F. Fama and Kenneth R.
      French" (the home page: "Kenneth R. French"; a script writes the year); the factor description page
      (Data_Library/f-f_factors.html) carries none. No page states that the files may be copied or
      redistributed, and each page's HTML source carries the comment "All images and code are property of Ken
      French. Use in part or whole is illegal except by permission of Ken French or Dimensional Fund Advisors"
      (the home page: "except by permission of Ken French."). Without a grant the files are not embedded; a lab
      that needs them must use bring-your-own-data mode (BLUEPRINT §5.3), with the student downloading the file.
  - name: Open Source Asset Pricing (Chen and Zimmermann)
    url: https://www.openassetpricing.com/
    checked: "2026-10-17"
    finding: >-
      The site asks "If you use the data, please cite our paper" and states no licence for the data. The code
      repository (https://github.com/OpenSourceAP/CrossSection) is under the GNU GPL v2, which covers the
      programs, not the data they produce from licensed CRSP and Compustat inputs. No redistribution grant for
      the data was found, so they are not embedded.
