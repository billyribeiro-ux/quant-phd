[project]
name = "quant-finance"
version = "0.1.0"
description = "Doctoral-track major in finance, economics & quantitative markets: curriculum, verified reference registry, and build tooling."
requires-python = ">=3.14"
# Dependencies are pinned in requirements.txt / requirements-dev.txt (single source of truth).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["tools", "tests"]
# Verifier mutants (VERIFIER_RULES §2.6) are deliberately wrong solutions; lint does not apply to them.
extend-exclude = ["ledgers/*/mutants", "ledgers/*/equivalent"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]
ignore = ["RUF001"]  # curriculum strings legitimately contain en dashes and accented names

[tool.ruff.lint.isort]
known-first-party = ["refs"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "tools"
files = ["tools", "tests"]
explicit_package_bases = true
# Lab twins are byte-identical to the code embedded in the pages, so they are not edited to satisfy a
# newer numpy stub. These two trip numpy 2.5 typing only (no runtime difference).
exclude = ["^tests/labs/S7/lab-S7-L08-4\\.py$", "^tests/labs/S7/lab-S7-L03-2\\.py$"]
