# What the site vendors, and where each file lands under course/assets/vendor/.
#
# Versions are explicit pins. `python3 tools/vendor.py lock` resolves each pin
# on the npm registry, refuses a version younger than policy.min_age_days, and
# records tarball URL, sha512 integrity and publish date in LOCK.json.
# `python3 tools/vendor.py install` downloads, verifies integrity, and extracts
# only the mapped files. Nothing here is ever loaded from a CDN at runtime.
#
# File map keys are paths inside the package (without the leading "package/").
# A key containing "*" is a glob; its destination must end in "/" and files keep
# their basenames.

policy:
  min_age_days: 14

packages:
  - name: katex
    version: "0.18.9"
    license: MIT
    files:
      "dist/katex.min.js": "katex/katex.min.js"
      "dist/katex.min.css": "katex/katex.min.css"
      "dist/contrib/auto-render.min.js": "katex/auto-render.min.js"
      "dist/fonts/*.woff2": "katex/fonts/"
      "LICENSE": "katex/LICENSE"

  - name: d3
    version: "7.9.0"
    license: ISC
    files:
      "dist/d3.min.js": "d3/d3.min.js"
      "LICENSE": "d3/LICENSE"

  # Pyodide core runtime (CPython 3.14 compiled to WebAssembly). The scientific
  # package set (numpy, scipy, pandas, ...) is distributed separately and is
  # fetched by CI, which has unrestricted network access; see BLUEPRINT §6.
  - name: pyodide
    version: "314.0.7"
    license: MPL-2.0
    files:
      "pyodide.mjs": "pyodide/pyodide.mjs"
      "pyodide.js": "pyodide/pyodide.js"
      "pyodide.asm.mjs": "pyodide/pyodide.asm.mjs"
      "pyodide.asm.wasm": "pyodide/pyodide.asm.wasm"
      "python_stdlib.zip": "pyodide/python_stdlib.zip"
      "pyodide-lock.json": "pyodide/pyodide-lock.json"
      "package.json": "pyodide/package.json"

  - name: "@duckdb/duckdb-wasm"
    version: "1.32.0"
    license: MIT
    files:
      "dist/duckdb-browser.mjs": "duckdb/duckdb-browser.mjs"
      "dist/duckdb-browser-eh.worker.js": "duckdb/duckdb-browser-eh.worker.js"
      "dist/duckdb-eh.wasm": "duckdb/duckdb-eh.wasm"
      "dist/duckdb-browser-mvp.worker.js": "duckdb/duckdb-browser-mvp.worker.js"
      "dist/duckdb-mvp.wasm": "duckdb/duckdb-mvp.wasm"
      "package.json": "duckdb/package.json"  # licence is declared here; the package ships no LICENSE file

  - name: "@fontsource-variable/source-serif-4"
    version: "5.3.0"
    license: OFL-1.1
    files:
      "files/source-serif-4-latin-wght-normal.woff2": "fonts/source-serif-4-latin-wght-normal.woff2"
      "files/source-serif-4-latin-wght-italic.woff2": "fonts/source-serif-4-latin-wght-italic.woff2"
      "files/source-serif-4-latin-ext-wght-normal.woff2": "fonts/source-serif-4-latin-ext-wght-normal.woff2"
      "files/source-serif-4-latin-ext-wght-italic.woff2": "fonts/source-serif-4-latin-ext-wght-italic.woff2"
      "LICENSE": "fonts/LICENSE-source-serif-4"

  - name: "@fontsource-variable/inter"
    version: "5.3.0"
    license: OFL-1.1
    files:
      "files/inter-latin-wght-normal.woff2": "fonts/inter-latin-wght-normal.woff2"
      "files/inter-latin-ext-wght-normal.woff2": "fonts/inter-latin-ext-wght-normal.woff2"
      "LICENSE": "fonts/LICENSE-inter"

  - name: "@fontsource-variable/jetbrains-mono"
    version: "5.3.0"
    license: OFL-1.1
    files:
      "files/jetbrains-mono-latin-wght-normal.woff2": "fonts/jetbrains-mono-latin-wght-normal.woff2"
      "files/jetbrains-mono-latin-ext-wght-normal.woff2": "fonts/jetbrains-mono-latin-ext-wght-normal.woff2"
      "LICENSE": "fonts/LICENSE-jetbrains-mono"
