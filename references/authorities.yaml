# Domains whose pages can establish identity for works without a Crossref DOI.
# This is policy, not bibliographic data: it says which sites are authoritative.
# Every field of an admitted entry still comes from the fetched page itself.
#
# issuers: the official issuer of a primary document (rule text, statute, court
#   opinion, methodology paper, data library). `short` prefixes the registry key.
# publishers: the publisher of record for a venue that does not register DOIs;
#   their landing pages must carry Highwire citation_* meta tags.
issuers:
  - {domain: federalreserve.gov, issuer: "Board of Governors of the Federal Reserve System", short: frb}
  - {domain: newyorkfed.org, issuer: "Federal Reserve Bank of New York", short: frbny}
  - {domain: stlouisfed.org, issuer: "Federal Reserve Bank of St. Louis", short: frbstl}
  - {domain: sec.gov, issuer: "U.S. Securities and Exchange Commission", short: sec}
  - {domain: cftc.gov, issuer: "U.S. Commodity Futures Trading Commission", short: cftc}
  - {domain: ecfr.gov, issuer: "Electronic Code of Federal Regulations", short: ecfr}
  - {domain: federalregister.gov, issuer: "Office of the Federal Register", short: fedreg}
  - {domain: govinfo.gov, issuer: "U.S. Government Publishing Office", short: gpo}
  - {domain: uscode.house.gov, issuer: "Office of the Law Revision Counsel, U.S. House of Representatives", short: uscode}
  - {domain: supremecourt.gov, issuer: "Supreme Court of the United States", short: scotus}
  - {domain: case.law, issuer: "Caselaw Access Project, Harvard Law School Library", short: cap}
  - {domain: home.treasury.gov, issuer: "U.S. Department of the Treasury", short: ust}
  - {domain: bis.org, issuer: "Bank for International Settlements", short: bis}
  - {domain: bankofengland.co.uk, issuer: "Bank of England", short: boe}
  - {domain: snb.ch, issuer: "Swiss National Bank", short: snb}
  - {domain: fasb.org, issuer: "Financial Accounting Standards Board", short: fasb}
  - {domain: ifrs.org, issuer: "IFRS Foundation", short: ifrs}
  - {domain: cboe.com, issuer: "Cboe Global Markets", short: cboe}
  - {domain: mba.tuck.dartmouth.edu, issuer: "Kenneth R. French, Tuck School of Business", short: french}
  - {domain: cfainstitute.org, issuer: "CFA Institute", short: cfa}
  - {domain: fast-standard.org, issuer: "FAST Standard Organisation", short: fast}
  - {domain: docs.python.org, issuer: "Python Software Foundation", short: psf}
publishers:
  - {domain: jmlr.org, issuer: "Journal of Machine Learning Research", short: jmlr}
  - {domain: proceedings.neurips.cc, issuer: "Neural Information Processing Systems Foundation", short: neurips}
  - {domain: papers.nips.cc, issuer: "Neural Information Processing Systems Foundation", short: neurips}
  - {domain: proceedings.mlr.press, issuer: "Proceedings of Machine Learning Research", short: pmlr}
  - {domain: aeaweb.org, issuer: "American Economic Association", short: aea}
  - {domain: ijcb.org, issuer: "International Journal of Central Banking", short: ijcb}
  - {domain: kansascityfed.org, issuer: "Federal Reserve Bank of Kansas City", short: frbkc}
  - {domain: brookings.edu, issuer: "Brookings Institution", short: brookings}
  - {domain: bankofengland.co.uk, issuer: "Bank of England", short: boe}
