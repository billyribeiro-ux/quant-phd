name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly live re-verification of every citation and every embedded dataset

permissions:
  contents: read

jobs:
  gates:
    name: Lint, types, tests, curriculum, registry, site data, page checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Tests (tooling, every lab, browser modules)
        run: pytest
      - name: Curriculum validates and generated files are current
        run: |
          python tools/render_curriculum.py
          git diff --exit-code -- CURRICULUM.md curriculum/curriculum.json
      - name: Site data and program map are current
        run: python tools/build_site.py --check
      - name: Registry integrity (offline)
        run: python tools/verify_refs.py --offline
      - name: Embedded market data matches its MANIFEST (offline)
        run: python tools/fetch_data.py --check
      - name: Page, concept and project checks on every released unit
        run: |
          python tools/check_pages.py --all
          python tools/check_dag.py --all
          python tools/check_projects.py --all

  course:
    name: Graders, mutants, and every page in Chromium
    needs: gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Vendored runtime (verified against LOCK.json)
        uses: actions/cache@v4
        with:
          path: course/assets/vendor
          key: vendor-${{ hashFiles('course/assets/vendor/LOCK.json') }}
      - run: python tools/fetch_vendor.py
      - run: python -m playwright install --with-deps chromium
      - name: Reference solutions pass on 50 seeds; starters fail
        run: python tools/run_graders.py --all --seeds 0-49
      - name: Every verifier mutant is killed
        run: python tools/mutate_graders.py --all --seeds 0-9
      - name: Every page renders, every lab and grader runs in Pyodide
        run: python tools/page_smoke.py --all
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-screenshots
          path: .cache/screens/
          if-no-files-found: ignore

  labs:
    name: In-page labs on CPython 3.14 (matches Pyodide 314.x)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python tools/run_labs.py --all

  live-citations:
    name: Live re-verification of every citation
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python tools/verify_refs.py

  live-data:
    name: Live refetch of every embedded dataset reproduces its snapshot
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python tools/fetch_data.py --fetch
      - name: Snapshots are byte-identical (a difference means the issuer revised history or the source moved)
        run: git diff --exit-code -- 'course/assets/data/market/*.csv'
